<style>
/* =====================================================================
   THE COLOSSEUM — дизайн-система
   Травертин, базальт, римское золото, терракота. Тонкие линии, арки,
   антиква для заголовков, системный гротеск для интерфейса.
   ===================================================================== */
:root{
  --bg:#F6F2EA;          /* травертин */
  --paper:#FFFDF8;       /* пергамент */
  --surf:#FFFFFF;
  --surf-2:#F0EBE0;
  --surf-3:#E7E0D2;
  --ink:#1B1713;         /* базальт */
  --ink-2:#5C5347;
  --ink-3:#8C8271;
  --line:#E3DCCA;
  --line-2:#EFE9DC;
  --gold:#A8823C;        /* римское золото */
  --gold-soft:#C9A961;
  --terra:#9C3A2A;       /* терракота */
  --olive:#5A6B3B;
  --shadow-s:0 1px 2px rgba(27,23,19,.05);
  --shadow-m:0 2px 8px rgba(27,23,19,.06), 0 12px 28px rgba(27,23,19,.07);
  --shadow-l:0 8px 40px rgba(27,23,19,.14);
  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:22px;
  --arch:14px;
  --font-d:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --font-u:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dark"]{
  --bg:#141210; --paper:#1B1815; --surf:#1F1B17; --surf-2:#26211C; --surf-3:#2E2822;
  --ink:#F1EADD; --ink-2:#B3A693; --ink-3:#817868;
  --line:#332D26; --line-2:#2A251F;
  --gold:#CFA95C; --gold-soft:#E0C48A; --terra:#D2694F; --olive:#9CAF72;
  --shadow-s:0 1px 2px rgba(0,0,0,.3);
  --shadow-m:0 2px 8px rgba(0,0,0,.35), 0 12px 28px rgba(0,0,0,.4);
  --shadow-l:0 10px 44px rgba(0,0,0,.55);
}
html[data-theme="dark"] .mark,
html[data-theme="dark"] .crest{filter:invert(1) brightness(1.06) contrast(.96)}
html[data-theme="dark"] .pane iframe{background:#fff}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.55 var(--font-u); background:var(--bg); color:var(--ink);
  overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;border-radius:4px}
::selection{background:rgba(168,130,60,.24)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--surf-3);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}

/* ------------------------------ chrome ------------------------------ */
.chrome{
  background:var(--paper); border-bottom:1px solid var(--line);
  flex:0 0 auto; position:relative; z-index:60; box-shadow:var(--shadow-s);
}
.tabstrip{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 0;min-height:38px}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1;align-items:flex-end}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 11px;
  border-radius:var(--arch) var(--arch) 0 0;      /* арка */
  color:var(--ink-2); background:transparent; border:1px solid transparent; border-bottom:0;
  max-width:220px; min-width:112px; position:relative; cursor:pointer;
  transition:background .14s var(--ease), color .14s var(--ease);
}
.tab:hover{background:var(--surf-2)}
.tab.active{
  background:var(--bg); color:var(--ink); border-color:var(--line);
  box-shadow:inset 0 2px 0 var(--gold);
}
.tab.pinned{min-width:auto;max-width:150px}
.tab .mark,.tab .glyph{width:15px;height:15px;object-fit:contain;flex:0 0 auto;opacity:.85}
.tab .glyph{
  display:grid;place-items:center;border-radius:50%;background:var(--surf-3);
  font:600 9px/1 var(--font-u);letter-spacing:.02em;color:var(--ink-2)
}
.tab.active .glyph{background:var(--gold);color:var(--paper)}
.tab .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;letter-spacing:.005em}
.tab .close{width:17px;height:17px;border-radius:50%;color:var(--ink-3);font-size:14px;line-height:15px;text-align:center;flex:0 0 auto}
.tab .close:hover{background:var(--surf-3);color:var(--terra)}
.tab .spin{width:13px;height:13px;border:1.6px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.newtab{
  width:30px;height:30px;border-radius:var(--arch) var(--arch) 0 0;color:var(--ink-3);
  font-size:17px;line-height:1;display:grid;place-items:center;margin-bottom:2px
}
.newtab:hover{background:var(--surf-2);color:var(--ink)}

.toolbar{display:flex;align-items:center;gap:4px;padding:8px 12px}
.nav-btn{
  width:30px;height:30px;border-radius:50%;color:var(--ink-2);font-size:15px;
  display:grid;place-items:center;transition:background .14s var(--ease),color .14s var(--ease);
}
.nav-btn:hover{background:var(--surf-2);color:var(--ink)}
.nav-btn:disabled{opacity:.3;cursor:default;background:none}
.nav-btn.on{color:var(--gold)}
.nav-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.omnibox{position:relative;flex:1;min-width:150px;margin:0 6px}
#omni{
  width:100%;height:34px;padding:0 62px 0 36px;border-radius:17px;
  background:var(--surf);border:1px solid var(--line);outline:none;font-size:13.5px;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease);
}
#omni::placeholder{color:var(--ink-3)}
#omni:focus{border-color:var(--gold-soft);background:var(--paper);box-shadow:0 0 0 3px rgba(168,130,60,.12)}
.omni-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px;pointer-events:none;line-height:1}
.omni-mode{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);font:600 9px/1 var(--font-u);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);pointer-events:none;
  padding:3px 6px;border-radius:20px;background:var(--surf-2);border:1px solid var(--line-2)
}

.suggest{
  position:absolute;top:41px;left:0;right:0;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-m);overflow:hidden;z-index:80;display:none;
  padding:4px;animation:pop .12s var(--ease)
}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.suggest.show{display:block}
.sg{display:flex;gap:10px;align-items:center;font-size:13px;padding:7px 9px;border-radius:var(--r-s);cursor:pointer}
.sg:hover,.sg.sel{background:var(--surf-2)}
.sg .ic{width:16px;text-align:center;color:var(--ink-3);flex:0 0 auto}
.sg .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .kind{font:600 9px/1 var(--font-u);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

.progress{height:2px;background:transparent;overflow:hidden;position:absolute;bottom:-1px;left:0;right:0}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-soft));transition:width .3s var(--ease),opacity .3s;opacity:0}
.progress.on i{opacity:1;width:65%}
.progress.done i{width:100%;opacity:0}

/* --------------------------- закладки-бар --------------------------- */
.bmbar{
  display:flex;align-items:center;gap:2px;padding:5px 12px;border-top:1px solid var(--line-2);
  background:var(--paper);overflow-x:auto;scrollbar-width:none
}
.bmbar::-webkit-scrollbar{display:none}
.bmbar .bmi{
  display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--r-s);
  font-size:12px;color:var(--ink-2);white-space:nowrap;max-width:170px
}
.bmbar .bmi:hover{background:var(--surf-2);color:var(--ink)}
.bmbar .bmi .glyph{width:14px;height:14px;border-radius:50%;background:var(--surf-3);display:grid;place-items:center;font:600 8px/1 var(--font-u);color:var(--ink-2)}
.bmbar .bmi span{overflow:hidden;text-overflow:ellipsis}
.bmbar.hidden{display:none}

/* ------------------------------ panes ------------------------------ */
#panes{position:relative;flex:1;min-height:0;background:var(--bg)}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:0;background:#fff}
.internal{position:absolute;inset:0;overflow:auto;background:var(--bg)}

/* ------------------------------ home ------------------------------ */
.home{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:44px 20px;gap:26px;text-align:center
}
.home .crest{width:104px;height:104px;opacity:.92;margin-bottom:-6px}
.home h1{
  margin:0;font:400 clamp(30px,5.2vw,46px)/1.05 var(--font-d);letter-spacing:.02em;
}
.home h1 .amp{color:var(--gold);font-style:italic;padding:0 .06em}
.home .tag{
  font:600 10px/1 var(--font-u);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3);
  margin-top:-16px
}
.hsearch{width:min(600px,100%);position:relative}
.hsearch input{
  width:100%;height:50px;padding:0 16px 0 46px;border-radius:25px;font-size:15.5px;
  background:var(--paper);border:1px solid var(--line);outline:none;box-shadow:var(--shadow-s);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)
}
.hsearch input:focus{border-color:var(--gold-soft);box-shadow:0 0 0 4px rgba(168,130,60,.10),var(--shadow-s)}
.hsearch .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:600px}
.chip{
  padding:6px 13px;border-radius:20px;background:transparent;border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);transition:all .14s var(--ease)
}
.chip:hover{border-color:var(--gold-soft);color:var(--ink);background:var(--paper)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;width:min(720px,100%)}
.tile{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:15px 8px;border-radius:var(--r-l);
  background:var(--paper);border:1px solid var(--line);cursor:pointer;
  transition:transform .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)
}
.tile:hover{transform:translateY(-2px);border-color:var(--gold-soft);box-shadow:var(--shadow-m)}
.tile .ic{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  background:var(--surf-2);color:var(--ink-2);border:1px solid var(--line-2)
}
.tile .t{font-size:11.5px;color:var(--ink-2);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect-title{
  font:600 9.5px/1 var(--font-u);text-transform:uppercase;letter-spacing:.26em;
  color:var(--ink-3);margin-top:14px;display:flex;align-items:center;gap:10px;width:min(720px,100%)
}
.sect-title::before,.sect-title::after{content:"";height:1px;background:var(--line);flex:1}
.clock{font:400 13px/1 var(--font-d);color:var(--ink-3);letter-spacing:.12em;font-variant-numeric:tabular-nums}

/* ------------------------------ выдача ------------------------------ */
.srp{max-width:860px;margin:0 auto;padding:20px 22px 90px}
.srp-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.srp-head .brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.srp-head .crest{width:30px;height:30px}
.srp-head .wm{font:400 19px/1 var(--font-d);letter-spacing:.02em}
.srp-head .qbox{flex:1;min-width:220px;position:relative}
.srp-head input{
  width:100%;height:38px;padding:0 14px 0 38px;border-radius:19px;background:var(--paper);
  border:1px solid var(--line);outline:none;font-size:14px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)
}
.srp-head input:focus{border-color:var(--gold-soft);box-shadow:0 0 0 3px rgba(168,130,60,.10)}
.srp-head .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);line-height:1}
.filters{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 14px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  padding:9px 13px;font-size:12.5px;color:var(--ink-2);border-bottom:2px solid transparent;
  white-space:nowrap;letter-spacing:.01em;transition:color .14s
}
.filter:hover{color:var(--ink)}
.filter.active{color:var(--gold);border-color:var(--gold);font-weight:600}
.meta{font-size:12px;color:var(--ink-3);margin-bottom:16px;line-height:1.7}
.res{display:flex;gap:16px;padding:15px 8px;border-bottom:1px solid var(--line-2);border-radius:var(--r-s);cursor:pointer;transition:background .14s}
.res:hover{background:var(--paper)}
.imgview{max-width:1100px;margin:0 auto;padding:16px}
.iv-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.iv-crumb{color:var(--fg-dim);font-size:13px}
.iv-stage{background:var(--surf-2);border:1px solid var(--line-2);border-radius:var(--arch);
  padding:12px;display:flex;align-items:center;justify-content:center;min-height:200px}
.iv-stage img{max-width:100%;max-height:66vh;object-fit:contain;border-radius:8px;display:block;background:#fff}
.iv-meta{margin-top:14px}
.iv-t{font-weight:600;font-size:17px;line-height:1.3}
.iv-u{color:var(--fg-dim);font-size:12px;word-break:break-all;margin-top:5px}
.iv-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.iv-actions .btn{text-decoration:none;display:inline-block}
[data-ui="mobile"] .iv-stage img{max-height:56vh}
[data-ui="mobile"] .imgview{padding:10px}

.dl-row .ic{font-size:9px;letter-spacing:0;width:34px;flex:0 0 34px;text-align:center}
.dl-bar{height:3px;margin-top:5px;border-radius:2px;background:var(--line);overflow:hidden}
.dl-bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .25s}
.dl-bar.done i{background:#3aa76d}
.dl-badge{position:absolute;top:1px;right:0;min-width:13px;height:13px;padding:0 3px;border-radius:7px;
  background:var(--acc);color:#fff;font-size:9px;line-height:13px;text-align:center;font-weight:700}
.nav-btn{position:relative}
.res .thumb{width:112px;height:80px;border-radius:var(--r-s);object-fit:cover;background:var(--surf-2);flex:0 0 auto;border:1px solid var(--line-2)}
.res .body{flex:1;min-width:0}
.res h3{margin:0 0 3px;font:400 18px/1.32 var(--font-d);letter-spacing:.005em}
.res h3 a{color:#2A5B8F}
html[data-theme="dark"] .res h3 a{color:#8FB6E0}
.res h3 a:hover{color:var(--gold);text-decoration:none}
.res .url{font-size:11.5px;color:var(--olive);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-m)}
.res .snip{font-size:13.5px;color:var(--ink-2);line-height:1.62;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge{
  display:inline-block;font:600 9px/1 var(--font-u);padding:3px 7px;border-radius:20px;
  background:var(--surf-2);color:var(--ink-3);margin-left:8px;vertical-align:2px;
  border:1px solid var(--line-2);letter-spacing:.08em;text-transform:uppercase
}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-s)}
.card h4{margin:0 0 8px;font:400 16px/1.3 var(--font-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.imgcard{border-radius:var(--r-m);overflow:hidden;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.imgcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}
.imgcard img{width:100%;height:148px;object-fit:cover;display:block;background:var(--surf-2);border-bottom:1px solid var(--line-2)}
.imgcard .cap{padding:8px 10px;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookcard{display:flex;gap:12px;padding:11px;border-radius:var(--r-m);background:var(--paper);border:1px solid var(--line);cursor:pointer;align-items:center;transition:border-color .14s}
.bookcard:hover{border-color:var(--gold-soft)}
.bookcard img{width:44px;height:64px;object-fit:cover;border-radius:3px;background:var(--surf-2);box-shadow:var(--shadow-s)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surf-2),var(--surf-3),var(--surf-2));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:9px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;color:var(--ink-3);padding:64px 20px}
.empty h2{font:400 22px/1.3 var(--font-d);color:var(--ink);margin:0 0 8px}

/* ------------------------------ ошибки ------------------------------ */
.err{max-width:620px;margin:70px auto;text-align:center;padding:0 20px}
.err .crest{width:74px;height:74px;opacity:.4;margin-bottom:6px}
.err h2{font:400 25px/1.3 var(--font-d);margin:0 0 10px}
.err p{color:var(--ink-2)}

/* --------------------------- списки страниц --------------------------- */
.plist{max-width:800px;margin:0 auto;padding:28px 22px 70px}
.plist h2{font:400 26px/1.2 var(--font-d);margin:0 0 4px}
.plist .sub{color:var(--ink-3);font-size:12.5px;margin-bottom:20px}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-m)}
.row:hover{background:var(--paper)}
.row .glyph{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surf-2);border:1px solid var(--line-2);font:600 10px/1 var(--font-u);color:var(--ink-2);flex:0 0 auto}
.row .m{flex:1;min-width:0}
.row .m .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.row .m .u{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-m)}
.row button{padding:4px 10px;border-radius:var(--r-s);font-size:12px;color:var(--ink-2);border:1px solid transparent}
.row button:hover{background:var(--surf-2);color:var(--terra);border-color:var(--line-2)}

/* ------------------------------ настройки ------------------------------ */
.set{max-width:740px;margin:0 auto;padding:28px 22px 70px}
.set h2{font:400 26px/1.2 var(--font-d);margin:0 0 20px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:4px 18px;margin-bottom:16px;box-shadow:var(--shadow-s)}
.group h3{font:600 9.5px/1 var(--font-u);text-transform:uppercase;letter-spacing:.22em;color:var(--ink-3);margin:18px 0 2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.opt:last-child{border-bottom:0}
.opt .lb{font-size:13.5px}
.opt .ds{font-size:12px;color:var(--ink-3);margin-top:3px;max-width:470px;line-height:1.5}
.opt code{font:12px var(--font-m);background:var(--surf-2);padding:1px 5px;border-radius:4px}
select,input[type=text].in{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;outline:none;min-width:150px;font-size:13px}
select:focus,input.in:focus{border-color:var(--gold-soft)}
.switch{width:42px;height:24px;border-radius:20px;background:var(--surf-3);position:relative;transition:.2s var(--ease);flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow-s);transition:.2s var(--ease)}
.switch.on{background:var(--gold)}
.switch.on::after{left:21px}

/* ------------------------------ меню ------------------------------ */
.menu{
  position:absolute;top:96px;right:12px;width:262px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-l);z-index:120;padding:6px;
  animation:pop .12s var(--ease)
}
.menu .mi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--r-s);font-size:13.5px;color:var(--ink-2)}
.menu .mi:hover{background:var(--surf-2);color:var(--ink)}
.menu .mi .k{margin-left:auto;font:600 10px/1 var(--font-m);color:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 0}
.menu .mih{font:600 9px/1 var(--font-u);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding:9px 11px 5px}

/* --------------------------- командная палитра --------------------------- */
.palette{position:fixed;inset:0;z-index:200;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.palette.show{display:flex}
.palette .veil{position:absolute;inset:0;background:rgba(27,23,19,.32);backdrop-filter:blur(3px)}
html[data-theme="dark"] .palette .veil{background:rgba(0,0,0,.55)}
.palette .box{
  position:relative;width:min(620px,100%);background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--shadow-l);overflow:hidden;animation:pop .14s var(--ease)
}
.palette input{
  width:100%;height:54px;padding:0 18px;border:0;border-bottom:1px solid var(--line-2);
  background:transparent;outline:none;font-size:15.5px
}
.palette .list{max-height:min(52vh,420px);overflow:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-m);cursor:pointer;font-size:13.5px}
.palette .it.sel,.palette .it:hover{background:var(--surf-2)}
.palette .it .ic{width:20px;text-align:center;color:var(--ink-3)}
.palette .it .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .it .sub{font-size:11.5px;color:var(--ink-3);max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-m)}
.palette .foot{border-top:1px solid var(--line-2);padding:8px 14px;font-size:11px;color:var(--ink-3);display:flex;gap:14px}
.palette .foot b{font:600 10px/1 var(--font-m);background:var(--surf-2);padding:2px 5px;border-radius:4px;color:var(--ink-2)}

/* --------------------------- поиск по странице --------------------------- */
.findbar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--paper);
  border-top:1px solid var(--line-2);box-shadow:var(--shadow-s)
}
.findbar input{
  width:210px;height:28px;padding:0 10px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surf);outline:none;font-size:13px
}
.findbar input:focus{border-color:var(--gold-soft)}
.findbar .cnt{font:12px/1 var(--font-m);color:var(--ink-3);min-width:52px}
.findbar .fb{width:26px;height:26px;border-radius:var(--r-s);color:var(--ink-2);display:grid;place-items:center;font-size:13px}
.findbar .fb:hover{background:var(--surf-2)}
.findbar.hidden{display:none}

/* ------------------------------ ридер ------------------------------ */
.reader{max-width:720px;margin:0 auto;padding:44px 26px 100px}
.reader .rtitle{font:400 32px/1.22 var(--font-d);letter-spacing:.01em;margin:0 0 10px}
.reader .rmeta{font-size:12px;color:var(--ink-3);letter-spacing:.04em;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:26px}
.reader .rbody{font:400 17.5px/1.75 var(--font-d);color:var(--ink)}
.reader .rbody p{margin:0 0 1.15em}
.reader .rbody h2,.reader .rbody h3{font:400 22px/1.35 var(--font-d);margin:1.7em 0 .6em}
.reader .rbody img{max-width:100%;height:auto;border-radius:var(--r-s);margin:1.4em 0}
.reader .rbody a{color:var(--gold);text-decoration:underline;text-decoration-color:rgba(168,130,60,.35);text-underline-offset:2px}
.reader .rbody blockquote{border-left:2px solid var(--gold-soft);margin:1.4em 0;padding:.2em 0 .2em 1.1em;color:var(--ink-2);font-style:italic}
.reader .rbody li{margin:.4em 0}
.reader .rbody figure{margin:1.5em 0}
.reader .rbody figcaption{font:12px/1.5 var(--font-u);color:var(--ink-3);margin-top:.6em}
.reader .rnotice{font-size:12.5px;color:var(--ink-3);margin-top:34px;padding-top:16px;border-top:1px solid var(--line-2)}

/* ------------------------------ оверлеи ------------------------------ */
.sheet{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;padding:20px}
.sheet.show{display:flex}
.sheet .veil{position:absolute;inset:0;background:rgba(27,23,19,.32);backdrop-filter:blur(2px)}
html[data-theme="dark"] .sheet .veil{background:rgba(0,0,0,.55)}
.sheet .box{
  position:relative;width:min(560px,100%);max-height:84vh;overflow:auto;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-l);padding:26px 28px;
  animation:pop .14s var(--ease)
}
.sheet h3{font:400 21px/1.3 var(--font-d);margin:0 0 18px}
.sheet .kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.sheet .kv:last-of-type{border-bottom:0}
.sheet .kv span:first-child{color:var(--ink-3)}
.sheet .kv span:last-child{text-align:right;font-family:var(--font-m);font-size:12px;overflow-wrap:anywhere;max-width:62%}
.keys{display:grid;grid-template-columns:1fr auto;gap:9px 18px;font-size:13px;align-items:center}
.keys .d{color:var(--ink-2)}
.keys .k{font:600 11px/1 var(--font-m);background:var(--surf-2);border:1px solid var(--line-2);padding:4px 7px;border-radius:5px;color:var(--ink-2);white-space:nowrap}
.btn{
  padding:9px 16px;border-radius:var(--r-m);background:var(--surf);border:1px solid var(--line);
  font-size:13px;color:var(--ink-2);transition:all .14s var(--ease)
}
.btn:hover{border-color:var(--gold-soft);color:var(--ink);background:var(--paper)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--gold);border-color:var(--gold);color:#fff}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:22px;
  box-shadow:var(--shadow-l);z-index:300;font-size:13px;opacity:0;transition:.22s var(--ease);pointer-events:none
}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
mark.nvfind{background:rgba(207,169,92,.42);color:inherit;border-radius:2px}
mark.nvfind.cur{background:var(--gold);color:#fff}

.fav{position:relative;width:15px;height:15px;flex:0 0 auto}
.fav img{position:absolute;inset:0;width:15px;height:15px;border-radius:50%;background:var(--paper)}
.fav .glyph{position:absolute;inset:0;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
  background:var(--surf-3);font:600 9px/1 var(--font-u);color:var(--ink-2)}
.menu .ctx{position:fixed}
/* ---------------------- Оракул и перевод ---------------------- */
.oracle{max-width:780px;margin:0 auto;padding:26px 22px 90px}
.oh-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.oh-head .brand{display:flex;align-items:center;gap:10px;font:400 22px/1 var(--font-d);cursor:pointer}
.oh-head .crest{width:32px;height:32px}
.oh-head .qbox{flex:1;min-width:220px;position:relative}
.oh-head input{width:100%;height:38px;padding:0 14px 0 38px;border-radius:19px;background:var(--paper);
  border:1px solid var(--line);outline:none}
.oh-head input:focus{border-color:var(--gold-soft)}
.oh-head .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.oracle-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 24px;box-shadow:var(--shadow-s)}
.oracle-answer{font:400 17px/1.72 var(--font-d);color:var(--ink);white-space:pre-line}
.oracle-wait{font-size:13px;color:var(--ink-3)}
.oracle-note{margin-top:14px;padding:9px 12px;border-radius:var(--r-s);background:var(--surf-2);
  border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.oracle-src{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
.oracle-src .oh{font:600 9.5px/1 var(--font-u);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.osrc{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-s);cursor:pointer;font-size:13px}
.osrc:hover{background:var(--surf-2)}
.osrc b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.osrc .u{margin-left:auto;font:11px var(--font-m);color:var(--ink-3)}
.osrc-inline{display:inline-block;margin:0 6px 6px 0;padding:3px 9px;border-radius:20px;background:var(--surf-2);
  border:1px solid var(--line-2);font-size:11.5px;color:var(--ink-2);cursor:pointer}
.osrc-inline:hover{border-color:var(--gold-soft);color:var(--ink)}
.oracle-mark{width:34px;height:auto;display:inline-block;vertical-align:middle;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.28))}
.oh-head .oracle-mark{width:40px;margin-right:2px}
.ot-ic .oracle-mark{width:22px}
.mi .oracle-mark{width:17px;margin-right:6px;vertical-align:-4px}
.oracle-card h4 .oracle-mark{width:22px;margin-right:6px;vertical-align:-5px}
.oracle-teaser{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px dashed var(--gold-soft);
  border-radius:var(--r-l);padding:14px 18px;margin-bottom:16px;cursor:pointer;transition:background .14s}
.oracle-teaser:hover{background:var(--surf-2)}
.ot-ic{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:var(--surf-2);
  border:1px solid var(--line-2);font-size:16px;color:var(--gold)}
.ot-tx{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.ot-sub{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
#adBtn.on{color:var(--gold)}
#adBtn.on svg path:last-child{stroke:var(--gold)}

/* =====================================================================
   МОБИЛЬНЫЙ ИНТЕРФЕЙС (включается автоматически: [data-ui="mobile"])
   Сверху — адресная строка, снизу — панель навигации, вкладки — экраном.
   ===================================================================== */
:root{ --mbar:58px; --mtop:0px }
.mtop{display:none}
.m-tabs{display:none!important}
.m-tabs b{
  position:absolute;right:1px;bottom:0;font:600 9px/1 var(--font-u);
  color:var(--ink-2);background:var(--surf-2);border-radius:8px;padding:2px 4px;min-width:15px;text-align:center
}
.navgroup,.actgroup{display:contents}
.tabsheet{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;flex-direction:column}
.tabsheet.show{display:flex}
.ts-head{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
  border-bottom:1px solid var(--line);background:var(--paper)}
.ts-head h3{font:400 18px/1 var(--font-d);margin:0;flex:1}
.ts-head .b{width:38px;height:38px;border-radius:50%;background:var(--surf-2);display:grid;place-items:center;font-size:20px;color:var(--ink-2)}
.ts-head .b:active{background:var(--surf-3)}
.ts-grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.ts-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
  position:relative;min-height:120px;display:flex;flex-direction:column;text-align:left}
.ts-card .pv{flex:1;background:var(--surf-2);display:grid;place-items:center;color:var(--ink-3);font-size:24px}
.ts-card .pv img{width:100%;height:100%;object-fit:cover}
.ts-card .tt{padding:8px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-top:1px solid var(--line-2);color:var(--ink-2)}
.ts-card .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.42);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.ts-card.add{border:1px dashed var(--line);display:grid;place-items:center;font-size:30px;color:var(--ink-3);background:transparent}
.ts-card.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(168,130,60,.22)}

/* ---------------- вкл. мобильный режим ---------------- */
[data-ui="mobile"] .mtop{display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px}
[data-ui="mobile"] .tabstrip,[data-ui="mobile"] .bmbar{display:none}
[data-ui="mobile"] .m-tabs{display:grid!important;position:relative}
[data-ui="mobile"] #reloadBtn{display:none}
[data-ui="mobile"] .omnibox{margin:0;flex:1}
[data-ui="mobile"] .toolbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:flex;justify-content:space-between;align-items:center;gap:0;
  padding:5px 6px calc(env(safe-area-inset-bottom,0px) + 5px);
  background:var(--paper);border-top:1px solid var(--line);
  box-shadow:0 -2px 16px rgba(27,23,19,.07)
}
[data-ui="mobile"] .navgroup,[data-ui="mobile"] .actgroup{display:flex;align-items:center;gap:0}
[data-ui="mobile"] .nav-btn{width:44px;height:44px;font-size:20px}
[data-ui="mobile"] .nav-btn svg{width:20px;height:20px}
[data-ui="mobile"] .nav-btn:active{background:var(--surf-2)}
[data-ui="mobile"] .progress{top:auto;bottom:calc(var(--mbar) + env(safe-area-inset-bottom,0px) - 2px)}

/* контент не залезает под нижнюю панель */
[data-ui="mobile"] .pane iframe{height:calc(100% - var(--mbar) - env(safe-area-inset-bottom,0px))}
[data-ui="mobile"] .internal{padding-bottom:calc(var(--mbar) + env(safe-area-inset-bottom,0px) + 12px)}

/* главная */
[data-ui="mobile"] .home{padding:22px 16px 30px;gap:20px}
[data-ui="mobile"] .home .crest{width:82px;height:82px}
[data-ui="mobile"] .home h1{font-size:31px}
[data-ui="mobile"] .hsearch input{height:48px}
[data-ui="mobile"] .tiles{grid-template-columns:repeat(4,1fr);gap:8px}
[data-ui="mobile"] .tile{padding:11px 4px;border-radius:var(--r-m)}
[data-ui="mobile"] .chip{padding:8px 14px}
[data-ui="mobile"] .chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;
  padding:2px 2px 6px;scrollbar-width:none}
[data-ui="mobile"] .chips::-webkit-scrollbar{display:none}
[data-ui="mobile"] .sect-title{width:100%}

/* выдача */
[data-ui="mobile"] .srp{padding:14px 14px 30px;max-width:none}
[data-ui="mobile"] .srp-head{gap:10px}
[data-ui="mobile"] .srp-head .qbox{flex:1 1 100%;order:5}
[data-ui="mobile"] .res{flex-direction:column;gap:9px;padding:14px 8px}
[data-ui="mobile"] .res .thumb{width:100%;height:170px}
[data-ui="mobile"] .res h3{font-size:17px}
[data-ui="mobile"] .grid{grid-template-columns:repeat(2,1fr)}
[data-ui="mobile"] .filters{margin:12px -14px 12px;padding:0 8px}
[data-ui="mobile"] .filter{padding:10px 11px}
[data-ui="mobile"] .card{padding:14px 15px}

/* ридер */
[data-ui="mobile"] .reader{padding:26px 18px 30px}
[data-ui="mobile"] .reader .rtitle{font-size:26px}
[data-ui="mobile"] .reader .rbody{font-size:17px;line-height:1.72}

/* списки и настройки */
[data-ui="mobile"] .plist,[data-ui="mobile"] .set{padding:18px 14px 30px;max-width:none}
[data-ui="mobile"] .opt{flex-wrap:wrap;gap:8px}
[data-ui="mobile"] .opt .ds{max-width:none}
[data-ui="mobile"] .row{padding:13px 8px}

/* меню — нижняя шторка */
[data-ui="mobile"] .menu{top:auto!important;bottom:calc(var(--mbar) + env(safe-area-inset-bottom,0px) + 8px)!important;
  left:8px!important;right:8px!important;width:auto!important;border-radius:var(--r-xl)}
[data-ui="mobile"] .menu .mi{padding:14px 15px;font-size:15px}
[data-ui="mobile"] .menu .mih{padding-top:12px}

/* палитра, поиск, шторки, тост */
[data-ui="mobile"] .palette{padding:6vh 10px 10px}
[data-ui="mobile"] .palette .box{width:100%;border-radius:var(--r-l)}
[data-ui="mobile"] .palette .list{max-height:56vh}
[data-ui="mobile"] .findbar{position:fixed;left:0;right:0;bottom:calc(var(--mbar) + env(safe-area-inset-bottom,0px));
  z-index:71;background:var(--paper);border-top:1px solid var(--line-2);box-shadow:var(--shadow-s)}
[data-ui="mobile"] .findbar input{flex:1;width:auto;height:34px}
[data-ui="mobile"] .sheet{align-items:flex-end;padding:0}
[data-ui="mobile"] .sheet .box{width:100%;max-width:none;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:86vh;
  padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
[data-ui="mobile"] .toast{bottom:calc(var(--mbar) + env(safe-area-inset-bottom,0px) + 14px)}
[data-ui="mobile"] .toast.show{bottom:calc(var(--mbar) + env(safe-area-inset-bottom,0px) + 22px);
  transform:translateX(-50%)}
[data-ui="mobile"] .err{margin:52px auto}
[data-ui="mobile"] .keys{grid-template-columns:1fr}
[data-ui="mobile"] .keys .k{justify-self:start}

@media (max-width:720px){
  .tab{max-width:130px}
  .tab .label{max-width:74px}
  .omni-mode{display:none}
  .srp{padding:16px 14px 80px}
  .home h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app">
  <header class="chrome">
    <div class="mtop" id="topSlot"></div>
    <div class="tabstrip">
      <div class="tabs" id="tabs"></div>
      <button class="newtab" id="newTabBtn" title="Новая вкладка (Ctrl+T)">+</button>
    </div>
    <div class="toolbar">
      <span id="omniSlot" hidden></span>
      <div class="navgroup">
      <button id="backBtn" class="nav-btn" title="Назад (Alt+←)"><svg viewBox="0 0 16 16"><path d="M10 3.2 5.2 8l4.8 4.8"/></svg></button>
      <button id="fwdBtn" class="nav-btn" title="Вперёд (Alt+→)"><svg viewBox="0 0 16 16"><path d="M6 3.2 10.8 8 6 12.8"/></svg></button>
      <button id="reloadBtn" class="nav-btn" title="Обновить (Ctrl+R)"><svg viewBox="0 0 16 16"><path d="M13.2 8a5.2 5.2 0 1 1-1.7-3.85"/><path d="M13.4 2.6v3.2h-3.2"/></svg></button>
      <button id="homeBtn" class="nav-btn" title="Домашняя (Alt+Home)"><svg viewBox="0 0 16 16"><path d="M2.6 7.2 8 2.8l5.4 4.4v6h-3.6v-3.8H6.2V13.2H2.6z"/></svg></button>
      <button id="tabsBtn" class="nav-btn m-tabs" title="Вкладки"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg><b id="tabsCount">1</b></button>
      </div>
      <div class="omnibox" id="omniBox">
        <span class="omni-ico">&#9906;</span>
        <input id="omni" type="text" placeholder="Поиск или адрес" autocomplete="off" spellcheck="false">
        <span class="omni-mode" id="omniMode"></span>
        <div id="suggest" class="suggest"></div>
      </div>
      <div class="actgroup">
      <button id="adBtn" class="nav-btn" title="Блокировка рекламы"><svg viewBox="0 0 16 16"><path d="M8 1.8 3 3.6v4.1c0 3.1 2.1 5.6 5 6.5 2.9-.9 5-3.4 5-6.5V3.6z"/><path d="M5.6 7.8 7.4 9.6l3.2-3.4"/></svg></button>
      <button id="dlBtn" class="nav-btn" title="Загрузки (Ctrl+J)"><svg viewBox="0 0 16 16"><path d="M8 2v7.5m0 0L5 6.5m3 3.2l3-3.2M2.8 13h10.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="dlCount" class="dl-badge" hidden></b></button>
      <button id="readerBtn" class="nav-btn" title="Режим чтения (Ctrl+Shift+R)"><svg viewBox="0 0 16 16"><path d="M2.6 3.6h10.8M2.6 8h10.8M2.6 12.4h6.6"/></svg></button>
      <button id="starBtn" class="nav-btn" title="В закладки (Ctrl+D)"><svg viewBox="0 0 16 16"><path d="M8 2.4l1.85 3.75 4.15.6-3 2.92.71 4.13L8 11.9l-3.71 1.9.71-4.13-3-2.92 4.15-.6z"/></svg></button>
      <button id="menuBtn" class="nav-btn" title="Меню (Alt+E)"><svg viewBox="0 0 16 16"><circle cx="8" cy="4" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </div>
    <div class="bmbar hidden" id="bmbar"></div>
    <div class="progress" id="progress"><i></i></div>
  </header>

  <div class="findbar hidden" id="findbar">
    <svg viewBox="0 0 16 16" width="15" height="15" style="color:var(--ink-3)"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    <input id="findInput" type="text" placeholder="Найти на странице" spellcheck="false">
    <span class="cnt" id="findCount">0 / 0</span>
    <button class="fb" id="findPrev" title="Назад (Shift+Enter)">&#8593;</button>
    <button class="fb" id="findNext" title="Вперёд (Enter)">&#8595;</button>
    <button class="fb" id="findClose" title="Закрыть (Esc)">&times;</button>
  </div>

  <main id="panes"></main>

  <div class="tabsheet" id="tabsheet">
    <div class="ts-head">
      <h3>Вкладки</h3>
      <button class="b" id="tsNew" title="Новая вкладка">+</button>
      <button class="b" id="tsDone" title="Готово">&times;</button>
    </div>
    <div class="ts-grid" id="tsGrid"></div>
  </div>

  <div class="palette" id="palette">
    <div class="veil" data-close="1"></div>
    <div class="box">
      <input id="paletteInput" type="text" placeholder="Команда, вкладка, закладка или запрос…" spellcheck="false">
      <div class="list" id="paletteList"></div>
      <div class="foot"><span><b>↑↓</b> выбрать</span><span><b>Enter</b> выполнить</span><span><b>Esc</b> закрыть</span></div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="veil" data-close="1"></div>
    <div class="box" id="sheetBox"></div>
  </div>

  <div id="menu" class="menu hidden"></div>
  <div id="toast" class="toast"></div>
</div>

let localProxyOK = null; // null = не проверяли

const PUBLIC_PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://r.jina.ai/' + u            // последний шанс: текстовая версия
];

/** JSON: сначала напрямую (если источник отдаёт CORS), иначе через загрузчик Colosseum */
async function getJSON(url, ms = 12000) {
  try {
    const r = await timeoutFetch(url, ms);
    if (r.ok) { const t = await r.text(); try { return JSON.parse(t); } catch {} }
  } catch {}
  const { html } = await fetchPage(url);
  return JSON.parse(html);
}

async function timeoutFetch(url, ms = 14000, opts) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, Object.assign({ signal: c.signal }, opts)); }
  finally { clearTimeout(t); }
}

/* Википедия отдаёт текст сама: у неё открытый CORS-API (origin=*).
   Идём напрямую, минуя прокси — быстрее и чище: без инфобоксов,
   таблиц, подписей к картинкам и прочего мусора. */
const WIKI_RE = /^https?:\/\/([a-z]{2,3}(?:-[a-z]{2})?)\.(?:m\.)?wikipedia\.org\/wiki\/([^#?]+)$/i;
async function wikiText(url) {
  const m = String(url).match(WIKI_RE);
  if (!m) return null;
  const api = 'https://' + m[1] + '.wikipedia.org/w/api.php?' + new URLSearchParams({
    action: 'query', format: 'json', formatversion: '2', origin: '*', redirects: '1',
    prop: 'extracts', explaintext: '1', titles: decodeURIComponent(m[2]).replace(/_/g, ' ')
  });
  const r = await timeoutFetch(api, 12000);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const pg = (await r.json())?.query?.pages?.[0];
  if (!pg || pg.missing || !pg.extract) return null;
  const text = String(pg.extract)
    .replace(/\n=+\s*(примечания|литература|ссылки|см\.? также|источники|библиография|комментарии|сноски)[^\n=]*=+[\s\S]*$/i, '')
    .replace(/^=+\s*[^\n]*?\s*=+$/gm, '')
    .replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').replace(/\n{2,}/g, '\n').trim();
  return text.length >= 120 ? { title: pg.title, text } : null;
}

async function detectLocalProxy() {
  if (localProxyOK !== null) return localProxyOK;
  if (location.protocol === 'file:' || settings.proxyMode === 'public') return (localProxyOK = false);
  try {
    const r = await timeoutFetch('/api/fetch?url=' + encodeURIComponent('https://example.com'), 4000);
    const j = await r.json();
    localProxyOK = !!(j && j.ok);
  } catch { localProxyOK = false; }
  return localProxyOK;
}

/** Загружает HTML страницы. Возвращает {html, finalUrl, via} */
async function fetchPage(url) {
  let lastErr;
  // 1) собственный локальный прокси (server.py) — самый надёжный путь
  if (settings.proxyMode !== 'public' && await detectLocalProxy()) {
    try {
      const r = await timeoutFetch('/api/fetch?url=' + encodeURIComponent(url), 20000);
      const j = await r.json();
      if (j && j.ok && j.text) return { html: j.text, finalUrl: j.final_url || url, via: 'local' };
      const err = (j && j.error) || 'local proxy error';
      // адрес не существует/не отвечает — другие прокси тут не помогут
      if (/Name or service not known|nodename|getaddrinfo|Connection refused|timed out|No route|Temporary failure|ERR_NAME/i.test(err))
        throw new Error('Сайт недоступен: ' + err);
      throw new Error(err);
    } catch (e) {
      lastErr = e;
      if (/^Сайт недоступен/.test(e.message)) throw e;
    }
  }
  if (settings.proxyMode === 'local') throw lastErr || new Error('Локальный прокси недоступен');
  // 2) публичные CORS-прокси
  for (const mk of PUBLIC_PROXIES) {
    try {
      const r = await timeoutFetch(mk(url), 11000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      if (txt && txt.length > 40) return { html: txt, finalUrl: url, via: 'public' };
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Все прокси недоступны');
}

/* --------------------- санитайзер + рендер страницы --------------------- */
function sanitize(html, baseUrl, tabId) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,noscript,iframe,object,embed,applet,audio,video,meta[http-equiv="refresh"]')
     .forEach(n => n.remove());
  sanitize.blocked = adblockOn() ? adblockClean(doc) : 0;
  doc.querySelectorAll('*').forEach(el => {
    for (const a of Array.from(el.attributes)) {
      if (/^on/i.test(a.name)) el.removeAttribute(a.name);
      if (/^(href|src|action|formaction|xlink:href)$/i.test(a.name) && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    }
  });
  const base = doc.createElement('base');
  base.href = baseUrl;
  doc.head.prepend(base);

  const st = doc.createElement('style');
  st.textContent = 'html{scrollbar-color:#8892a0 transparent} body{margin:0} a{color:inherit}'
    + (adblockOn() ? '\n' + adblockCSS() : '');
  doc.head.appendChild(st);

  // скрипт-агент: ловит клики и шлёт их родителю (iframe в sandbox без allow-same-origin)
  const sc = doc.createElement('script');
  sc.textContent = `
  var TAB = ${JSON.stringify(tabId)};
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a');
    if(!a || !a.getAttribute('href')) return;
    e.preventDefault();
    parent.postMessage({__colosseum:'nav', url:a.href, tab:TAB}, '*');
  }, true);
  document.addEventListener('submit', function(e){
    e.preventDefault();
    var f = e.target, u = new URL(f.getAttribute('action') || document.baseURI, document.baseURI);
    if((f.method||'get').toLowerCase()==='get'){
      new FormData(f).forEach(function(v,k){ u.searchParams.set(k, v); });
      parent.postMessage({__colosseum:'nav', url:u.href, tab:TAB}, '*');
    }
  }, true);
  /* --- поиск по странице (по команде из браузера) --- */
  var MK=[], MI=-1;
  function clearF(){
    [].forEach.call(document.querySelectorAll('mark.nvf'), function(m){
      var p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m);
      if(p.normalize) p.normalize();
    });
    MK=[]; MI=-1;
  }
  function doFind(text){
    clearF();
    if(!text) return 0;
    var re=new RegExp(text.replace(/[.*+?^\${}()|[\\]\\\\]/g,'\\\\$&'),'gi');
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var nodes=[], n;
    while((n=w.nextNode())){
      if(/^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.parentNode.nodeName)) continue;
      if(!n.nodeValue.trim()) continue;
      nodes.push(n);
    }
    nodes.forEach(function(node){
      var s=node.nodeValue, hits=[], m;
      re.lastIndex=0;
      while((m=re.exec(s))!==null){ hits.push([m.index,m[0].length]); if(m.index===re.lastIndex) re.lastIndex++; }
      if(!hits.length) return;
      var frag=document.createDocumentFragment(), last=0;
      hits.forEach(function(h){
        frag.appendChild(document.createTextNode(s.slice(last,h[0])));
        var mk=document.createElement('mark');
        mk.className='nvf';
        mk.style.cssText='background:rgba(255,196,0,.55);color:#000;border-radius:2px';
        mk.textContent=s.substr(h[0],h[1]);
        frag.appendChild(mk); last=h[0]+h[1];
      });
      frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag,node);
    });
    MK=[].slice.call(document.querySelectorAll('mark.nvf'));
    return MK.length;
  }
  function goFind(dir){
    if(!MK.length) return {i:0,n:0};
    MK.forEach(function(m){ m.style.background='rgba(255,196,0,.55)'; });
    MI=(MI+dir+MK.length)%MK.length;
    var m=MK[MI];
    m.style.background='#ff9f1c';
    m.scrollIntoView({block:'center'});
    return {i:MI+1,n:MK.length};
  }
  window.addEventListener('message', function(e){
    var d=e.data; if(!d||d.__colosseum!=='find') return;
    if(d.text!==undefined){ var n=doFind(d.text); var r=n?goFind(d.dir||1):{i:0,n:0};
      parent.postMessage({__colosseum:'findres', n:r.n, i:r.i, tab:TAB}, '*'); }
    else { var r2=goFind(d.dir||1); parent.postMessage({__colosseum:'findres', n:r2.n, i:r2.i, tab:TAB}, '*'); }
  });
  parent.postMessage({__colosseum:'ready', title:document.title, tab:TAB}, '*');`;
  doc.body.appendChild(sc);
  return '<!doctype html>' + doc.documentElement.outerHTML;
}

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !['nav', 'ready', 'findres'].includes(d.__colosseum)) return;
  const tab = tabs.find(t => t.id === d.tab); if (!tab) return;
  if (d.__colosseum === 'nav') {

});

/* --- источники --- */
async function srcWiki(q, lang) {
  const base = `https://${lang}.wikipedia.org/w/api.php?format=json&origin=*`;
  // generator=search отдаёт страницы в порядке pageid, а не по релевантности,
  // поэтому порядок берём из list=search и накладываем на карточки.
  const [j, order] = await Promise.all([
    getJSON(base + '&action=query'
      + `&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=8&gsrnamespace=0`
      + `&prop=extracts|pageimages&exintro=1&explaintext=1&exlimit=max&piprop=thumbnail&pithumbsize=300`),
    getJSON(base + '&action=query&list=search'
      + `&srsearch=${encodeURIComponent(q)}&srlimit=10&srnamespace=0`).catch(() => null)
  ]);
  const pages = (j && j.query && j.query.pages) || {};
  const ord = new Map();
  ((order && order.query && order.query.search) || []).forEach((x, i) => ord.set(String(x.title).toLowerCase(), i));
  return Object.values(pages).map(p => ({
    title: p.title,
    url: `https://${lang}.wikipedia.org/wiki/` + encodeURIComponent(p.title.replace(/ /g, '_')),
    snippet: (p.extract || '').slice(0, 400),
    thumb: p.thumbnail && p.thumbnail.source,
    ord: ord.has(String(p.title).toLowerCase()) ? ord.get(String(p.title).toLowerCase()) : 20,
    source: 'wiki', srcLabel: 'Энциклопедия'
  }));
}

/** POST формы через наш локальный прокси (SearXNG принимает поиск только POST) */
async function postForm(url, form) {
  const r = await timeoutFetch('/api/fetch', 22000, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, form })
  });
  const j = await r.json();
  if (!j.ok || !j.text) throw new Error(j.error || 'proxy error');
  return j.text;
}

async function srcWeb(q, lang) {
  // Открытый SearXNG почти весь закрыт антиботами, поэтому мета-поиск идёт
  // через HTML-выдачу DuckDuckGo: она отдаёт настоящий веб, в том числе по-русски.
  try {
    const u = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q)
      + '&kl=' + (lang === 'ru' ? 'ru-ru' : 'wt-wt');
    const { html } = await fetchPage(u);
    const out = parseDuck(html);
    if (out.length) return out;
  } catch {}
  const inst = (settings.searx || '').replace(/\/+$/, '');
  if (!inst) return [];
  const form = { q, language: lang, safesearch: '0', categories: 'general' };
  let html = null;
  if (settings.proxyMode !== 'public' && await detectLocalProxy()) {
    try { html = await postForm(inst + '/search', form); } catch {}
  }
  if (!html) ({ html } = await fetchPage(inst + '/search?' + new URLSearchParams(form)));
  return parseSearx(html);
}

/** Разбор HTML-выдачи DuckDuckGo: заголовок, настоящий адрес (в uddg) и описание */
function parseDuck(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  doc.querySelectorAll('.result.results_links, .web-result, .result').forEach(n => {
    const a = n.querySelector('a.result__a') || n.querySelector('h2 a') || n.querySelector('a');
    if (!a) return;
    const raw = a.getAttribute('href') || '';
    const m = raw.match(/uddg=([^&]+)/);
    let u = m ? decodeURIComponent(m[1]) : raw;
    try { u = new URL(u, 'https://duckduckgo.com').href; } catch { return; }
    if (!/^https?:\/\//i.test(u) || /duckduckgo\.com/i.test(u)) return;
    const snip = n.querySelector('.result__snippet') || n.querySelector('.result__snippetShort');
    out.push({
      title: a.textContent.trim().slice(0, 140) || host(u),
      url: u, snippet: (snip?.textContent || '').trim().slice(0, 400),
      thumb: null, source: 'web', srcLabel: 'Веб'
    });
  });
  return out.slice(0, 14);
}

/** Разбор выдачи SearXNG: современная и старая вёрстки */
function parseSearx(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  const nodes = doc.querySelectorAll('article.result, .result, .result-item, .url-wrapper');
  nodes.forEach(n => {
    const a = n.querySelector('h3 a, .result-title a, a.result-link') || n.querySelector('a[href^="http"]');
    if (!a) return;
    const u = a.href;
    if (!/^https?:/.test(u)) return;
    if (/searx|github\.com\/searxng/i.test(u)) return;
    const title = (a.textContent || '').trim();
    if (!title) return;
    let snip = '';
    const scan = root => root.querySelectorAll('p').forEach(p => {
      const t = p.textContent.trim();
      if (t.length > snip.length) snip = t;
    });
    scan(n);
    if (!snip && n.parentElement) scan(n.parentElement);
    out.push({ title, url: u, snippet: snip.slice(0, 400), thumb: n.querySelector('img')?.src || null,
               source: 'web', srcLabel: 'Мета-поиск' });
  });
  return out.slice(0, 16);
}

/* --- ранжировщик ArenaRank --- */
const SRC_WEIGHT = { instant: 100, wiki: 62, entities: 45, web: 58, marginalia: 52, books: 40,
  images: 34, openverse: 30, discuss: 38, archive: 46, dict: 54, science: 42 };
const SRC_NAMES = { instant:'Справка', wiki:'Энциклопедия', entities:'База знаний', web:'Веб',
                    marginalia:'Веб-индекс', books:'Книги', images:'Картинки', openverse:'Медиа', discuss:'Обсуждения',
  archive:'Архив', dict:'Словарь', science:'Наука' };

const normTitle = s => String(s || '').toLowerCase()
  .replace(/[^a-zа-яё0-9 ]/gi, ' ').replace(/\s+/g, ' ').trim();

/** Лёгкая основа слова: «Войну»→«войн», «построил»→«постро», «истории»→«истори» */
function stemRu(w) {
  let x = String(w).toLowerCase().replace(/ё/g, 'е');
  if (x.length <= 3) return x;
  x = x.replace(/(иями|ями|ами|иях|ях|ией|ой|ый|ий|ая|яя|ое|ее|ые|ие|ому|ему|ыми|ими|ем|ом|ах|ам|ям|ую|юю|ии|ия|ию|ием|ей|ил|ила|или|ило|ена|ено|ены|но|ны|ть|ет|ут|ют|ат|ят|ла|ло|ли|ен|ся|сь|[уюаыяеой])$/, '');
  return x.length >= 3 ? x : String(w).toLowerCase();
}
function stemSet(txt) {
  const out = new Set();
  String(txt).toLowerCase().split(/[^a-zа-яё0-9]+/i).forEach(w => { if (w) out.add(stemRu(w)); });
  return out;
}

const Q_STOP = new Set(['кто','что','как','где','когда','почему','зачем','сколько','какой','какая','какое',
  'какие','каков','чей','куда','откуда','ли','это','есть','был','была','было','назови','расскажи','найди',
  'такое','такой','такая','такие','таков','означает','называется','называют','назови','значит',
  'дай','покажи','подробнее','коротко','пример','примеры',
  'the','what','who','whom','whose','how','why','when','where','which','is','are','was','were','a','an',
  'of','in','on','for','with','and','or','to','do','does','did']);

function rank(results, q) {
  const terms = q.toLowerCase().split(/\s+/).filter(t => t.length > 2);
  const core = terms.filter(w => !Q_STOP.has(w));                 // смысловые слова запроса
  const coreSet = new Set(core);
  const seen = new Set();
  const nq = normTitle(q);
  return results.map(r => {
    let s = SRC_WEIGHT[r.source] ?? 30;
    const t = (r.title || '').toLowerCase(), sn = (r.snippet || '').toLowerCase(), h = host(r.url);
    const nt = normTitle(r.title);
    if (nt === nq) s += 30;                    // точное совпадение заголовка
    else if (nt.startsWith(nq)) s += 14;
    else if (nt.includes(nq)) s += 8;
    const tStem = stemSet(t);
    terms.forEach(w => {
      const rare = Math.min(8, w.length / 2);          // длинные (редкие) термины весомее
      if (t.startsWith(w)) s += 16 + rare;
      else if (t.includes(w)) s += 9 + rare;
      else if (tStem.has(stemRu(w))) s += 7 + rare;    // та же основа: «Войну» ↔ «Война»
      else if (stemSet(sn).has(stemRu(w))) s += 3;
      if (sn.includes(w)) s += 4;
    });
    if (core.length) {
      // заголовок целиком — это главное слово запроса (запрос «кто построил колизей» → «Колизей»)
      if (nt === core[core.length - 1]) s += 14;
      if (core.every(w => nt.includes(w))) s += 10;               // заголовок покрывает весь смысл
      // уточнение в скобках, которого не было в запросе: «Колизей (Москва)» — не то, что искали
      const par = String(r.title || '').toLowerCase().match(/\(([^)]{2,40})\)/);
      if (par && !nq.includes(par[1]) && !coreSet.has(par[1])) s -= 14;
      else if (par) s += 4;                                        // скобка совпала с запросом
    }
    if (typeof r.ord === 'number') s += Math.max(0, 16 - r.ord * 2);   // порядок самого источника
    if (r.thumb) s += 5;
    if (r.snippet && r.snippet.length > 90) s += 4;
    if (/\.(gov|edu|org)\b/.test(h)) s += 4;
    if (/wikipedia\.org/.test(h)) s += 6;
    if (!r.snippet) s -= 8;
    return Object.assign({}, r, { score: s });
  })
  .filter(r => {
    const key = normUrl(r.url).replace(/#.*$/, '');
    const k2 = (r.title || '').toLowerCase().trim();
    if (seen.has(key) || (k2 && seen.has('t:' + k2))) return false;
    seen.add(key); if (k2) seen.add('t:' + k2);
    return true;
  })
  .sort((a, b) => b.score - a.score);
}

async function arenaSearch(q, opts) {
  const S = settings.sources, lang = settings.lang;
  const fast = !!(opts && opts.fast);      // Оракулу нужны только тексты и побыстрее
  // Быстрые источники отвечают сами (у них открытый CORS), медленным нужен прокси.
  // На статическом хостинге своего прокси нет: ждём чужие индексы лишь недолго,
  // чтобы выдача не упиралась в публичные прокси на десятки секунд.
  const local = await detectLocalProxy();
  const slowMs = local ? 8000 : 2000;
  const jobs = [];
  const add = (on, id, fn, ms) => {
    if (!on) return;
    const job = fn().then(list => ({ id, list: list || [], ok: true }))
                    .catch(() => ({ id, list: [], ok: false }));
    jobs.push(ms
      ? Promise.race([job, new Promise(r => setTimeout(() => r({ id, list: [], ok: false, slow: true }), ms))])
      : job);
  };
  add(S.instant,    'instant',    () => srcInstant(q, lang), 2500);   // часто недоступен — не ждём
  add(S.wiki,       'wiki',       () => srcWiki(q, lang), 6000);
  add(S.entities,   'entities',   () => srcEntities(q, lang), 4000);
  add(S.books,      'books',      () => srcBooks(q), 3000);
  add(S.marginalia, 'marginalia', () => srcMarginalia(q), Math.min(slowMs, fast ? 2000 : 4000));
  add(S.archive,    'archive',    () => srcArchive(q),    fast ? 2500 : 6000);
  add(S.dict,       'dict',       () => srcDict(q, lang), fast ? 2000 : 4000);
  add(S.science,    'science',    () => srcScience(q),    fast ? 2500 : 6000);
  add(S.web,        'web',        () => srcWeb(q, lang),  Math.min(slowMs, fast ? 2500 : 8000));
  if (!fast) add(S.images, 'images', () => srcImages(q), slowMs);   // Оракулу картинки не нужны
  add(S.discuss,    'discuss',    () => srcDiscuss(q, lang), fast ? 2500 : 6000);

  const done = await Promise.all(jobs);
  const stats = {};
  done.forEach(d => { stats[d.id] = { n: d.list.length, ok: d.ok }; });
  const results = rank(done.flatMap(d => d.list), q);
  return { results, stats, ms: 0 };
}

async function suggestions(q) {
  const out = [];
  const low = q.toLowerCase();
  history_.slice(0, 60).forEach(h => {
    if ((h.title && h.title.toLowerCase().includes(low)) || h.url.toLowerCase().includes(low))
      out.push({ kind: 'История', text: h.title || h.url, url: h.url });
  });
  bookmarks.forEach(b => {
    if ((b.title && b.title.toLowerCase().includes(low)) || b.url.toLowerCase().includes(low))
      out.push({ kind: 'Закладка', text: b.title || b.url, url: b.url });
  });
  try {
    const r = await timeoutFetch(`https://${settings.lang}.wikipedia.org/w/api.php?action=opensearch&format=json&origin=*&limit=6&search=` + encodeURIComponent(q), 4000);
    const j = await r.json();
    (j[1] || []).forEach(t => out.push({
      kind: 'Энциклопедия', text: t,
      url: `https://${settings.lang}.wikipedia.org/wiki/` + encodeURIComponent(t.replace(/ /g, '_'))
    }));
  } catch {}
  const ded = new Set();
  return out.filter(s => { const k = s.url + s.text; if (ded.has(k)) return false; ded.add(k); return true; }).slice(0, 9);
}

let tabs = [];
let activeId = null;
const frames = new Map();   // tabId -> iframe

function saveTabs() {
  save(K.tabs, { tabs: tabs.map(t => ({ id: t.id, title: t.title, url: t.url, stack: t.stack, idx: t.idx })), activeId });
}
function restoreTabs() {
  const s = load(K.tabs, null);
  if (s && s.tabs && s.tabs.length) {
    tabs = s.tabs.map(t => Object.assign({ mode: settings.render, loading: false }, t));
    activeId = s.activeId && tabs.some(t => t.id === s.activeId) ? s.activeId : tabs[0].id;
  } else {
    newTab(settings.home, { activate: true });
  }
}
const activeTab = () => tabs.find(t => t.id === activeId) || tabs[0];

function newTab(url = settings.home, { activate = true } = {}) {
  const t = { id: uid(), title: 'Новая вкладка', url, stack: [], idx: -1, mode: settings.render, loading: false };
  const i = tabs.findIndex(x => x.id === activeId);
  tabs.splice(i < 0 ? tabs.length : i + 1, 0, t);
  if (activate) activeId = t.id;
  renderTabs(); renderPanes(); saveTabs();
  if (url) navigate(t, url);
  return t;
}
function closeTab(id) {
  const i = tabs.findIndex(t => t.id === id); if (i < 0) return;
  const f = frames.get(id); if (f) f.remove(); frames.delete(id);
  tabs.splice(i, 1);
  if (!tabs.length) { newTab(settings.home, { activate: true }); return; }
  if (activeId === id) activeId = tabs[Math.max(0, i - 1)].id;
  renderTabs(); renderPanes(); saveTabs();
}

function renderTabs() {
  const pinnedOn = tabs.some(t => t.pinned);
  const ordered = pinnedOn ? [...tabs].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) : tabs;
  $('#tabs').innerHTML = ordered.map(t => {
    const h = host(t.url), letter = (h[0] || '?').toUpperCase();
    let icon = `<span class="glyph">${letter}</span>`;
    if (isInternal(t.url)) icon = `<img class="mark" src="${CREST_S}" alt="">`;
    else if (settings.favicons) icon =
      `<span class="fav"><img src="${esc(favi(t.url))}" alt="" onerror="this.style.display='none'"><span class="glyph">${letter}</span></span>`;
    return `
    <div class="tab ${t.id === activeId ? 'active' : ''} ${t.pinned ? 'pinned' : ''}" data-id="${t.id}" title="${esc(t.title + (t.pinned ? ' · закреплено' : ''))}">
      ${t.loading ? '<span class="spin"></span>' : icon}
      ${t.pinned ? '' : `<span class="label">${esc(t.title)}</span>`}
      ${t.pinned ? '' : `<button class="close" data-close="${t.id}">&times;</button>`}
    </div>`;
  }).join('');
  if (typeof updateTabsBtn === 'function') updateTabsBtn();
}

function renderPanes() {
  const known = new Set(tabs.map(t => t.id));
  frames.forEach((f, id) => { if (!known.has(id)) { f.remove(); frames.delete(id); } });
  panes.querySelectorAll('.pane').forEach(p => { if (!known.has(p.dataset.id)) p.remove(); });

  tabs.forEach(t => {
    let pane = panes.querySelector(`.pane[data-id="${t.id}"]`);
    if (!pane) { pane = document.createElement('div'); pane.className = 'pane'; pane.dataset.id = t.id; panes.appendChild(pane); }
    pane.classList.toggle('active', t.id === activeId);
  });
  const at = activeTab();
  updateChrome();
  if (isInternal(at.url)) renderInternal(at);
}

function updateChrome() {
  const t = activeTab(); if (!t) return;
  $('#backBtn').disabled = t.idx <= 0;
  $('#fwdBtn').disabled = t.idx >= t.stack.length - 1;
  if (document.activeElement !== $('#omni')) $('#omni').value = isInternal(t.url) ? '' : t.url;
  const starred = bookmarks.some(b => normUrl(b.url) === normUrl(t.url));
  $('#starBtn').classList.toggle('on', starred);
  $('#omniMode').textContent = t.mode === 'native' ? 'orig' : (t.via === 'public' ? 'pub' : 'safe');
  saveTabs();
}

   4. НАВИГАЦИЯ
   ====================================================================== */
/** Это адрес, а не поисковый запрос? */
function isUrlLike(s) {
  s = s.trim();
  if (/^colosseum:/i.test(s)) return true;
  if (/^(https?|ftp|file|about):/i.test(s)) return true;
  if (/^localhost(:\d+)?(\/|$)/i.test(s)) return true;
  if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?(\/|$)/.test(s)) return true;   // IP
  if (/\s/.test(s)) return false;                                    // пробелы → запрос
  return /^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|:|$)/i.test(s);              // домен с точкой
}
function toUrl(s) {
  s = s.trim();
  if (/^colosseum:/i.test(s)) return s;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) return 'https://' + s;
  return s;
}

/** Перехват «чужих» поисков: google/yandex/bing/duckduckgo → Arena */
function interceptForeign(url) {
  try {
    const u = new URL(url); const h = u.hostname.replace(/^www\./, '');
    const q = u.searchParams.get('q') || u.searchParams.get('text') || u.searchParams.get('query') || u.searchParams.get('p');
    const isSearchPath = /^(\/search|\/search\/?$|\/$)/.test(u.pathname);
    const isEngine = ['google.com', 'yandex.ru', 'ya.ru', 'bing.com', 'duckduckgo.com', 'search.brave.com',
                      'search.marcia.cc', 'go.mail.ru', 'rambler.ru', 'ecosia.org', 'startpage.com'].includes(h);
    if (isEngine && q && isSearchPath) {
      toast('The Colosseum: запрос перехвачен у «' + h + '» и выполнен в своей выдаче');
      return 'colosseum://search?q=' + encodeURIComponent(q);
    }
  } catch {}
  return url;
}

/* --- просмотр картинки: если открывают файл изображения, показываем его сами --- */
const IMG_EXT = /\.(jpe?g|png|gif|webp|avif|svg|bmp|ico)(\?|#|$)/i;
function imgViewUrl(u, page, title, orig) {
  const q = new URLSearchParams();
  q.set('u', u);
  if (page) q.set('p', page);
  if (title) q.set('t', title);
  if (orig && orig !== u) q.set('o', orig);
  return 'colosseum://image?' + q.toString();
}

async function navigate(tab, input, { replace = false, fromPage = false } = {}) {
  if (!tab) return;
  const raw = String(input).trim();
  // сначала решаем: это адрес или поисковый запрос (до подстановки схемы!)
  let url = isUrlLike(raw)
    ? (settings.intercept ? interceptForeign(toUrl(raw)) : toUrl(raw))
    : 'colosseum://search?q=' + encodeURIComponent(raw);
  url = normUrl(url);
  if (!isInternal(url) && IMG_EXT.test(url) && !/\/wiki\//i.test(url)) url = imgViewUrl(url);  // не «белый фон», а картинка
  if (!isInternal(url) && FILE_RE.test(url)) { startDownload(url); return; }                     // ссылка на файл — качаем
  if (!/^colosseum:\/\/search/i.test(url)) tab.search = null;
  if (!/^colosseum:\/\/blank/i.test(url)) tab.view = null;

  if (replace) { tab.stack[tab.idx] = url; }
  else {
    if (tab.idx < tab.stack.length - 1) tab.stack.length = tab.idx + 1;
    tab.stack.push(url); tab.idx = tab.stack.length - 1;
  }
  tab.url = url;
  tab.loading = true;
  try { history.pushState({ colosseum: ++navSeq }, ''); } catch {}

  if (!isInternal(url)) {
    tab.title = host(url) || url;
    pushHistory(url, host(url) || url);
  }
  renderTabs(); renderPanes();

  if (isInternal(url)) {
    tab.loading = false; renderTabs();
    if (!/^colosseum:\/\/oracle/i.test(url)) renderInternal(tab);
    const m = url.match(/^colosseum:\/\/search\?q=(.*)$/i);
    if (m) runSearch(tab, decodeURIComponent(m[1]), { fromPage });
  } else {
    await loadWeb(tab, url);
  }
  updateChrome();
}

function back(tab) { if (tab.idx > 0) { tab.idx--; goStack(tab); } }
function forward(tab) { if (tab.idx < tab.stack.length - 1) { tab.idx++; goStack(tab); } }
function goStack(tab) {
  const url = tab.stack[tab.idx]; tab.url = url;
  if (isInternal(url)) {
    renderInternal(tab);
    const m = url.match(/^colosseum:\/\/search\?q=(.*)$/i);
    if (m) runSearch(tab, decodeURIComponent(m[1]));
    else { tab.loading = false; }
  } else { tab.title = host(url) || url; loadWeb(tab, url); }
  renderTabs(); renderPanes(); updateChrome();
}
function reload(tab) {
  if (tab.view === 'reader') { openReader(tab, true); return; }
  if (isInternal(tab.url)) {
    const m = tab.url.match(/^colosseum:\/\/search\?q=(.*)$/i);
    if (m) { runSearch(tab, decodeURIComponent(m[1])); return; }
    renderPanes(); return;
  }
  if (tab.mode === 'native') {
    const f = frames.get(tab.id);
    if (f) { f.src = 'about:blank'; setTimeout(() => { f.src = tab.url; }, 30); }
  } else loadWeb(tab, tab.url, true);
}

/* -------------------------- загрузка сайта -------------------------- */
async function loadWeb(tab, url, force = false) {
  const pane = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  if (!pane) return;
  tab.loading = true; renderTabs(); progress(true);

  let frame = frames.get(tab.id);
  if (!frame || frame.dataset.mode !== tab.mode || force) {
    if (frame) frame.remove();
    frame = document.createElement('iframe');
    frame.className = 'web';
    frame.dataset.mode = tab.mode;
    if (tab.mode === 'native') {
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
      frame.referrerPolicy = 'no-referrer';
    } else {
      frame.setAttribute('sandbox', 'allow-scripts');
    }
    frames.set(tab.id, frame);
  }
  pane.innerHTML = ''; pane.appendChild(frame);

  try {
    if (tab.mode === 'native') {
      await new Promise((res, rej) => {
        frame.onload = () => res();
        frame.onerror = () => rej(new Error('blocked'));
        setTimeout(res, 12000);
        frame.src = url;
      });
      tab.title = host(url); tab.blocked = 0;
    } else {
      const t0 = performance.now();
      const { html, finalUrl, via } = await fetchPage(url);
      tab.ms = Math.round(performance.now() - t0);
      tab.bytes = html.length;
      tab.raw = html;
      frame.dataset.tab = tab.id;
      frame.srcdoc = sanitize(html, finalUrl, tab.id);
      tab.title = (html.match(/<title[^>]*>([^<]{1,140})/i)?.[1] || host(url)).trim();
      tab.via = via; tab.blocked = sanitize.blocked || 0; updateAdBtn();
updateDlBtn();
    }
    tab.err = null;
  } catch (e) {
    tab.err = String(e.message || e);
    renderError(tab, url, tab.err);
  }
  tab.loading = false; progress(false);
  renderTabs(); updateChrome();
}

function internalHTML(tab, html) {
  const pane = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  if (!pane) return;
  const f = frames.get(tab.id); if (f) { f.remove(); frames.delete(tab.id); }
  pane.innerHTML = `<div class="internal">${html}</div>`;
}

function renderInternal(tab) {
  const u = tab.url;
  if (/^colosseum:\/\/(home|newtab)/i.test(u)) return renderHome(tab);
  if (/^colosseum:\/\/search/i.test(u)) return tab.search ? renderSRP(tab) : undefined;
  if (/^colosseum:\/\/oracle/i.test(u)) {
    const m = u.match(/q=([^&]*)/i);
    const q = m ? decodeURIComponent(m[1]) : '';
    tab.oracle = q; runOracle(tab, q); return;
  }
  if (/^colosseum:\/\/image/i.test(u)) return renderImageView(tab);
  if (/^colosseum:\/\/downloads/i.test(u)) return renderDownloads(tab);
  if (/^colosseum:\/\/history/i.test(u)) return renderHistory(tab);
  if (/^colosseum:\/\/bookmarks/i.test(u)) return renderBookmarks(tab);
  if (/^colosseum:\/\/settings/i.test(u)) return renderSettings(tab);
  return renderHome(tab);
}
