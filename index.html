/* ------------------------------ выдача ------------------------------ */
let searchCache = new Map();

/* ---- выдача: результаты появляются по мере ответа источников ---- */
function sourceTasks(q, lang) {
  const S = settings.sources, out = [];
  const add = (on, id, fn, ms) => { if (on) out.push({ id, fn, ms }); };
  add(S.instant,    'instant',    () => srcInstant(q, lang),     9000);
  add(S.wiki,       'wiki',       () => srcWiki(q, lang),       12000);
  add(S.entities,   'entities',   () => srcEntities(q, lang),   10000);
  add(S.marginalia, 'marginalia', () => srcMarginalia(q),       18000);
  add(S.web,        'web',        () => srcWeb(q, lang),        18000);
  add(S.books,      'books',      () => srcBooks(q),            12000);
  add(S.images,     'images',     () => srcImages(q),           12000);
  add(S.openverse,  'openverse',  () => srcOpenverse(q),        15000);
  add(S.archive,    'archive',    () => srcArchive(q),           8000);
  add(S.dict,       'dict',       () => srcDict(q, lang),        5000);
  add(S.science,    'science',    () => srcScience(q),           8000);
  add(S.discuss,    'discuss',    () => srcDiscuss(q, lang),     7000);
  return out;
}
function withTimeout(p, ms) {
  let t;
  return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(new Error('timeout')), ms); })])
    .finally(() => clearTimeout(t));
}

async function runSearch(tab, q) {
  q = (q || '').trim();
  const pane = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  if (!pane || !q) return;

  let filter = 'all';
  const bm = q.match(/^(!\w+|![а-яё])\s+/i);
  if (bm && BANGS[bm[1].toLowerCase()]) { filter = BANGS[bm[1].toLowerCase()].src; q = q.slice(bm[0].length); }

  const run = (tab.runId = (tab.runId || 0) + 1);
  const key = q + '|' + settings.lang + '|' + Object.values(settings.sources).join('');
  tab.title = q + ' — Поиск Arena';
  tab.loading = true;
  progress(true);

  if (searchCache.has(key)) {
    tab.search = { q, filter, payload: searchCache.get(key), done: true };
    tab.loading = false; progress(false);
    renderTabs(); renderSRP(tab); return;
  }

  const payload = { results: [], stats: {} };
  tab.search = { q, filter, payload, done: false };
  renderTabs(); renderSRP(tab);

  await Promise.all(sourceTasks(q, settings.lang).map(async t => {
    try {
      const list = (await withTimeout(t.fn(), t.ms)) || [];
      payload.stats[t.id] = { n: list.length, ok: true };
      payload.results = rank(payload.results.concat(list), q);
    } catch {
      payload.stats[t.id] = { n: 0, ok: false };
    }
    if (tab.runId === run && tab.search && tab.search.payload === payload) renderSRP(tab);
  }));

  // если ушли с выдачи на сайт или начали новый поиск — этот результат уже никому не нужен
  if (tab.runId !== run || !tab.search || tab.search.payload !== payload) return;
  tab.search.done = true;
  searchCache.set(key, payload);
  tab.loading = false; progress(false);
  renderTabs(); renderSRP(tab);
}

function renderSRP(tab) {
  const s = tab.search;
  const pane = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  if (!s || !pane) return;
  const { q, payload } = s;
  const filter = s.filter || 'all';
  const all = payload.results;
  const stats = payload.stats || {};
  const loading = all.length === 0 && !s.done;

  const srcLine = Object.entries(stats).map(([k, v]) =>
    `${SRC_NAMES[k] || k} ${v.ok ? v.n : '—'}`).join(' · ');
  const pending = sourceTasks(q, settings.lang).filter(t => !(t.id in stats)).length;

  const groups = [
    ['all', 'Всё'], ['instant', 'Справка'], ['wiki', 'Энциклопедия'], ['dict', 'Словарь'],
    ['marginalia', 'Веб-индекс'], ['web', 'Веб'], ['books', 'Книги'], ['archive', 'Архив'],
    ['science', 'Наука'], ['images', 'Картинки'], ['openverse', 'Медиа'],
    ['discuss', 'Обсуждения'], ['entities', 'База знаний']
  ];
  const list = filter === 'all' ? all : all.filter(r => r.source === filter);
  const instant = all.find(r => r.source === 'instant');

  const body = loading ? Array.from({ length: 6 }).map(() => `
      <div style="padding:14px 4px"><div class="skel" style="width:38%"></div><div class="skel" style="width:72%;height:19px"></div>
      <div class="skel" style="width:90%"></div><div class="skel" style="width:64%"></div></div>`).join('')
    : list.length ? '' : `<div class="empty"><h2>${filter === 'all' ? 'Ничего не нашлось' : 'В этой категории пусто'}</h2>
        <p>Запрос «${esc(q)}». ${(filter === 'marginalia' || filter === 'web')
          ? 'Независимые веб-индексы почти не покрывают русский язык — попробуйте запрос на английском, либо поднимите свой SearXNG.'
          : 'Попробуйте другие слова или включите больше источников в '}
        <a href="colosseum://settings" data-go="colosseum://settings" style="color:var(--acc)">настройках</a>.</p></div>`;

  const cards = loading ? '' : (filter === 'all'
    ? (() => { let k = 0; return all.filter(r => r.source !== 'instant' && (r.source !== 'images' || ++k <= 6))  // картинок — меру
        .slice(0, 26).map(resRow).join(''); })()
    : filter === 'images'
      ? `<div class="grid">${list.map(r => `<div class="imgcard" data-url="${esc(imgViewUrl(r.thumb || r.url, r.url, r.title, r.full))}">
            <img src="${esc(r.thumb || '')}" loading="lazy" alt=""><div class="cap">${esc(r.title)}</div></div>`).join('')}</div>`
      : filter === 'books'
        ? `<div class="grid">${list.map(r => `<div class="bookcard" data-url="${esc(r.url)}">
            <img src="${esc(r.thumb || '')}" loading="lazy"><div><div style="font-weight:600">${esc(r.title)}</div>
            <div style="font-size:12px;color:var(--fg-dim)">${esc(r.snippet || '')}</div></div></div>`).join('')}</div>`
        : list.map(resRow).join(''));

  internalHTML(tab, `
  <div class="srp">
    <div class="srp-head">
      <div class="brand" style="cursor:pointer" data-go="colosseum://home">${LOGO}<span style="font-size:24px">Colosseum</span></div>
      <div class="qbox"><span class="ic">&#9906;</span><input id="srpQ" value="${esc(q)}" spellcheck="false"></div>
    </div>
    <div class="filters">
      ${groups.map(([id, label]) => `<button class="filter ${id === filter ? 'active' : ''}" data-f="${id}">${label}</button>`).join('')}
    </div>
    <div class="meta">${loading ? 'Опрашиваем открытые источники…'
      : `Найдено ${all.length}${s.done ? '' : ` · догружаем ещё ${pending}`} · ранжировщик ArenaRank · без Google и Яндекса<br>
         <span style="opacity:.7">${esc(srcLine)}</span>`}</div>
    ${(!loading && Object.values(stats).some(v => !v.ok)) ? `<div class="card" style="padding:11px 14px;font-size:12.5px;color:var(--fg-dim)">
        Некоторые источники не ответили. Мета-поиск (SearXNG) часто закрыт антиботом — укажите свой
        инстанс в <a href="colosseum://settings" data-go="colosseum://settings" style="color:var(--acc)">настройках</a>.</div>` : ''}
    ${(!loading && filter === 'all' && !s.oracle) ? `
      <div class="oracle-teaser" data-oracle="1">
        <div class="ot-ic">${ORACLE_IMG}</div>
        <div class="ot-tx"><b>Спросить Оракула</b> — просканировать найденные сайты и собрать короткий ответ
          <span class="ot-sub">обычно 3–8 секунд</span></div>
      </div>` : ''}
    ${(!loading && s.oracle) ? `
      <div class="card oracle-card">
        <h4>${ORACLE_IMG} Ответ Оракула</h4>
        <div class="oracle-answer">${esc(s.oracle.answer || 'Ответ собрать не удалось')}</div>
        <div class="oracle-src">
          ${(s.oracle.sources || []).map(x => `<span class="osrc-inline" data-url="${esc(x.url)}">${esc(host(x.url))}</span>`).join('')}
          <span class="ot-sub">просканировано ${s.oracle.scanned} · ${s.oracle.ms} мс</span>
        </div>
      </div>` : ''}
    ${(!loading && instant && filter === 'all') ? `
      <div class="card"><h4>${esc(instant.title)}</h4>
        <div style="color:var(--fg-dim);font-size:14px">${esc(instant.snippet)}</div>
        ${instant.url ? `<div style="margin-top:8px"><a href="${esc(instant.url)}" data-url="${esc(instant.url)}" style="color:var(--acc);font-size:12.5px">источник</a></div>` : ''}
      </div>` : ''}
    ${body}${cards}
  </div>`);

  const root = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  const input = root.querySelector('#srpQ');
  input?.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(tab, input.value.trim()); });
  root.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => { oracleCache.delete(data ? data.q : ''); runOracle(tab, data ? data.q : ''); });
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => navigate(tab, b.dataset.go));
  root.querySelectorAll('[data-url]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); navigate(tab, b.dataset.url); });
  root.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { s.filter = b.dataset.f; renderSRP(tab); });
  const ot = root.querySelector('[data-oracle]');
  if (ot) ot.onclick = async () => {
    ot.querySelector('.ot-tx').innerHTML = '<b>Оракул сканирует сайты…</b>';
    const data = await oracleAnswer(s.q);
    if (!data.answer) { toast('Сайты не отдали текст — попробуйте другой запрос'); renderSRP(tab); return; }
    s.oracle = data; renderSRP(tab);
  };
  root.querySelectorAll('[data-url]').forEach(b => {
    if (b.classList.contains('osrc-inline')) b.onclick = e => { e.preventDefault(); e.stopPropagation(); navigate(tab, b.dataset.url); };
  });
}

function renderError(tab, url, msg) {

      <button class="btn" id="eSearch">Найти в Arena</button>
    </div>

  const root = panes.querySelector(`.pane[data-id="${tab.id}"]`);

  };

}

/* ------------------------------ история ------------------------------ */
function pushHistory(url, title) {
  if (isInternal(url)) return;
  history_ = history_.filter(h => normUrl(h.url) !== normUrl(url));
  history_.unshift({ url, title, ts: Date.now() });
  if (history_.length > 400) history_.length = 400;
  save(K.hist, history_);
}

  let items = [];
  if (isUrlLike(v)) items.push({ kind: 'Перейти', text: toUrl(v), url: toUrl(v) });
  items.push({ kind: 'Поиск Arena', text: v, url: 'colosseum://search?q=' + encodeURIComponent(v) });

  items = items.concat(s);
  sgItems = items;

      <span class="tx">${esc(it.text)}</span><span class="kind">${esc(it.kind)}</span></div>`).join('');
  sgBox.classList.add('show');
});
omni.addEventListener('keydown', e => {
  if (sgBox.classList.contains('show') && sgItems.length) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sgIndex = (sgIndex + (e.key === 'ArrowDown' ? 1 : -1) + sgItems.length) % sgItems.length;
      sgBox.querySelectorAll('.sg').forEach((n, i) => n.classList.toggle('sel', i === sgIndex));
      return;
    }
    if (e.key === 'Escape') { sgBox.classList.remove('show'); return; }
  }
  if (e.key === 'Enter') {
    const pick = sgIndex >= 0 ? sgItems[sgIndex] : null;
    sgBox.classList.remove('show'); sgIndex = -1;
    navigate(activeTab(), pick ? pick.url : omni.value.trim());
    omni.blur();
  }

  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 't') { e.preventDefault(); newTab(settings.home); }
  else if (mod && e.key.toLowerCase() === 'l') { e.preventDefault(); omni.focus(); omni.select(); }
  else if (mod && e.key.toLowerCase() === 'w') { e.preventDefault(); closeTab(activeId); }
  else if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); $('#starBtn').click(); }
  else if (mod && e.key.toLowerCase() === 'r') { e.preventDefault(); reload(activeTab()); }
  else if (e.altKey && e.key === 'ArrowLeft') back(activeTab());
  else if (e.altKey && e.key === 'ArrowRight') forward(activeTab());
  else if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); paletteOpen(); }
  else if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFind(); }
  else if (mod && e.shiftKey && e.key.toLowerCase() === 'r') { e.preventDefault(); openReader(activeTab()); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); savePage(activeTab()); }
  else if (mod && e.key === '/') { e.preventDefault(); showShortcuts(); }
  else if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); omni.focus(); omni.value = ''; }
  else if (e.key === 'Escape') {
    if ($('#palette').classList.contains('show')) paletteClose();
    else if ($('#sheet').classList.contains('show')) sheetClose();
    else if (!$('#findbar').classList.contains('hidden')) toggleFind();
    else if ($('#menu').classList.contains('hidden') === false) $('#menu').classList.add('hidden');
  }
  else if (e.altKey && e.key === 'Home') { e.preventDefault(); navigate(activeTab(), settings.home); }
  else if (e.altKey && e.key.toLowerCase() === 'e') { e.preventDefault(); $('#menuBtn').click(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); navigate(activeTab(), 'colosseum://downloads'); }
  else if (mod && e.key === 'Tab') {
    e.preventDefault();
    const i = tabs.findIndex(t => t.id === activeId);
    activeId = tabs[(i + (e.shiftKey ? -1 : 1) + tabs.length) % tabs.length].id;
    renderTabs(); renderPanes(); updateReaderBtn();
  }
});

/* Свой экстрактор статьи: оценка блоков по плотности текста, без внешних сервисов */
function extractArticle(html, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const kill = 'script,style,template,noscript,iframe,object,embed,svg,form,button,input,select,textarea,nav,footer,aside,[role=navigation],[aria-hidden=true]';
  doc.querySelectorAll(kill).forEach(n => n.remove());
  doc.querySelectorAll('[class*=comment i],[id*=comment i],[class*=sidebar i],[class*=footer i],[class*=advert i],[class*=banner i],[class*=promo i],[class*=share i],[class*=social i],[class*=related i],[class*=newsletter i],[class*=cookie i],[class*=popup i],[class*=modal i],[class*=widget i]')
     .forEach(n => { if (n.tagName !== 'BODY') n.remove(); });

  const meta = sel => doc.querySelector(sel)?.content || doc.querySelector(sel)?.textContent || '';
  let root0 = null;
  let title = (meta('meta[property="og:title"]') || doc.querySelector('h1')?.textContent || doc.title || '')
    .replace(/\s+/g, ' ').trim()
    .replace(/\s*[-\u2013\u2014|]\s*(Wikipedia|\u0412\u0438\u043a\u0438\u043f\u0435\u0434\u0438\u044f)\s*$/i, '');
  const byline = meta('meta[name=author]') || doc.querySelector('[rel=author],.author,[class*=byline i]')?.textContent || '';
  const published = meta('meta[property="article:published_time"]') || doc.querySelector('time')?.getAttribute('datetime') || '';

  // сначала пробуем известные контейнеры статьи: так не попадают меню, языки и служебные блоки
  const PREFERRED = ['article', '[itemprop=articleBody]', '.mw-parser-output', '#mw-content-text',
    '.mw-body-content', '.post-content', '.entry-content', '.article-content', '.article-body',
    '.story-body', '.post-body', '.c-entry-content', '.td-post-content', '.single-content',
    '.blog-post', '.article__body', '#article-body', '.content-article', '.text',
    'main', '[role=main]'];
  let best = null, bestScore = 0;
  for (const sel of PREFERRED) {
    let el = null;
    try { el = doc.querySelector(sel); } catch {}
    if (el && (el.textContent || '').trim().length > 400) { best = el; break; }
  }
  if (best) {
    root0 = best;
    best.querySelectorAll('#toc,.toc,[class*=editsection i],[class*=reference i],[class*=navbox i],[class*=mw-jump i]')
        .forEach(n => n.remove());
  }
  doc.querySelectorAll('article,main,[role=main],section,div').forEach(el => {
    if (best) return;
    const txt = (el.textContent || '').trim();
    if (txt.length < 220) return;
    const ps = Math.min(el.querySelectorAll('p').length, 40);
    const links = el.querySelectorAll('a').length;
    const density = links / Math.max(1, txt.length / 100);
    const cls = ((el.className || '') + ' ' + (el.id || '')).toLowerCase();
    let sc = Math.min(txt.length, 9000) / 150 + ps * 4;
    if (/article|content|post|entry|story|main|text|body|page/.test(cls)) sc += 40;
    if (/comment|sidebar|nav|menu|widget|ad|footer/.test(cls)) sc -= 40;
    if (density > 6) sc -= 30;
    if (el.tagName === 'ARTICLE' || el.tagName === 'MAIN') sc += 25;
    if (sc > bestScore) { bestScore = sc; best = el; }
  });

  const root = root0 || best || doc.body;
  root.querySelectorAll(kill).forEach(n => n.remove());
  root.querySelectorAll('p,li').forEach(p => { if ((p.textContent || '').trim().length < 25 && !p.querySelector('img')) p.remove(); });
  root.querySelectorAll('div,section,span').forEach(n => {
    if ((n.textContent || '').trim().length < 20 && !n.querySelector('p,img,h2,h3,li')) n.remove();
  });
  root.querySelectorAll('[src],[href],[srcset]').forEach(n => {
    ['src', 'href', 'srcset'].forEach(a => {
      const v = n.getAttribute(a); if (!v || /^(data:|#|javascript:|mailto:)/i.test(v)) return;
      if (a === 'srcset') {
        n.setAttribute(a, v.split(',').map(part => {
          const [u, d] = part.trim().split(/\s+/);
          try { return new URL(u, url).href + (d ? ' ' + d : ''); } catch { return part; }
        }).join(', '));
        return;
      }
      try { n.setAttribute(a, new URL(v, url).href); } catch {}
    });
  });

  const words = (root.textContent || '').trim().split(/\s+/).length;
  return {
    title: String(title).trim().slice(0, 200),
    byline: String(byline).trim().slice(0, 120),
    site: host(url), published: String(published).slice(0, 10),
    html: root.innerHTML, words,
    minutes: Math.max(1, Math.round(words / 180))
  };
}

async function openReader(tab, force = false) {
  if (!tab || isInternal(tab.url)) { toast('Режим чтения — для сайтов'); return; }
  progress(true);
  try {
    if (force || !tab.raw) { const r = await fetchPage(tab.url); tab.raw = r.html; }
    const art = extractArticle(tab.raw, tab.url);
    tab.reader = art; tab.view = 'reader';
    tab.title = (art.title || host(tab.url)).slice(0, 60);
    renderReader(tab, art);
    updateReaderBtn(); renderTabs(); updateChrome();
  } catch (e) {
    toast('Не удалось построить версию для чтения');
  }
  progress(false);
}

function fuzzy(q, text) {
  if (!q) return 1;
  const a = q.toLowerCase(), b = text.toLowerCase();
  const i = b.indexOf(a);
  if (i >= 0) return 100 - i + (i === 0 ? 40 : 0);
  let ai = 0, score = 0, streak = 0;
  for (let bi = 0; bi < b.length && ai < a.length; bi++) {
    if (b[bi] === a[ai]) { ai++; streak++; score += 2 + streak; } else streak = 0;
  }
  return ai === a.length ? score : 0;
}

const findState = { marks: [], idx: -1, q: '', scope: null };

function toggleFind() {
  const bar = $('#findbar');
  if (bar.classList.contains('hidden')) {
    bar.classList.remove('hidden');
    $('#findInput').focus(); $('#findInput').select();
  } else {
    bar.classList.add('hidden'); clearFind();
    (activeTab() && frames.get(activeTab().id)) && frameFind(frames.get(activeTab().id), '', 1);
  }
}
function clearFind() {
  findState.marks = []; findState.idx = -1; findState.q = '';
  document.querySelectorAll('mark.nvfind').forEach(m => {
    const p = m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent), m);
    if (p.normalize) p.normalize();
  });
  $('#findCount').textContent = '0 / 0';
}
function frameFind(frame, text, dir) {
  try { frame.contentWindow.postMessage({ __colosseum: 'find', text, dir }, '*'); } catch {}
}
function runFind(dir = 1) {
  const q = $('#findInput').value.trim();
  if (!q) { clearFind(); return; }
  const tab = activeTab();
  const frame = frames.get(tab.id);

  if (frame && tab.view !== 'reader' && tab.mode === 'proxy') {   // страница в песочнице — ищем через агент
    frameFind(frame, q, dir);
    findState.q = q; findState.scope = 'frame';
    return;
  }
  // внутренние страницы и режим чтения — ищем сами
  const root = panes.querySelector(`.pane[data-id="${tab.id}"] .internal`) ||
               panes.querySelector(`.pane[data-id="${tab.id}"]`);
  if (!root) return;
  if (q !== findState.q) { clearFind(); findState.q = q; highlightIn(root, q); }
  if (!findState.marks.length) { $('#findCount').textContent = '0 / 0'; return; }
  findState.idx = (findState.idx + dir + findState.marks.length) % findState.marks.length;
  findState.marks.forEach((m, i) => m.classList.toggle('cur', i === findState.idx));
  findState.marks[findState.idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
  $('#findCount').textContent = (findState.idx + 1) + ' / ' + findState.marks.length;
}
function highlightIn(root, q) {
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  const nodes = []; let n;
  while ((n = w.nextNode())) {
    const p = n.parentNode.nodeName;
    if (/^(SCRIPT|STYLE|NOSCRIPT|MARK)$/.test(p)) continue;
    if (!n.nodeValue.trim()) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const s = node.nodeValue, hits = [];
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(s)) !== null) {
      hits.push([m.index, m[0].length]);
      if (m.index === re.lastIndex) re.lastIndex++;
    }
    if (!hits.length) return;
    const frag = document.createDocumentFragment();
    let last = 0;
    hits.forEach(h => {
      frag.appendChild(document.createTextNode(s.slice(last, h[0])));
      const mk = document.createElement('mark');
      mk.className = 'nvfind'; mk.textContent = s.substr(h[0], h[1]);
      frag.appendChild(mk);
      last = h[0] + h[1];
    });
    frag.appendChild(document.createTextNode(s.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  findState.marks = [...root.querySelectorAll('mark.nvfind')];
  findState.idx = -1;
}

  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) m.style.left = (innerWidth - r.width - 8) + 'px';
  if (y + r.height > innerHeight - 8) m.style.top = (innerHeight - r.height - 8) + 'px';

function detectUI() {
  try {
    const p = new URLSearchParams(location.search).get('ui');
    if (p === 'mobile' || p === 'desktop') return p;
  } catch {}
  if (settings.ui === 'mobile' || settings.ui === 'desktop') return settings.ui;
  const uaM = /Android|iPhone|iPod|Windows Phone|webOS|BlackBerry|Opera Mini|Mobile/i.test(navigator.userAgent);
  const iPad = /Macintosh/.test(navigator.userAgent) && (navigator.maxTouchPoints || 0) > 1;   // iPad под видом Mac
  const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const narrow = Math.min(innerWidth, innerHeight) <= 820;
  return (uaM || iPad || (coarse && narrow)) ? 'mobile' : 'desktop';
}

  const m = force || detectUI();
  const box = $('#omniBox'), slot = $('#omniSlot');

/* ======================================================================
   14. ЗАГРУЗКИ
   Ссылки на файлы (pdf, zip, mp3, mp4, apk, epub…) перехватываются:
   файл качается в память, сохраняется в «Загрузки» устройства
   и остаётся на вкладке «Загрузки».
   ====================================================================== */

const DL_KEY = 'colosseum.dl.v1';
const FILE_RE = /\.(pdf|zip|rar|7z|tar|gz|tgz|bz2|xz|apk|aab|exe|msi|dmg|deb|rpm|appimage|mp3|m4a|ogg|wav|flac|opus|mp4|webm|avi|mkv|mov|torrent|epub|fb2|djvu|doc|docx|xls|xlsx|ppt|pptx|odt|ods|odp|csv|json|txt|iso|bin|jar|whl|ttf|otf|woff2?|psd|dwg)(\?|#|$)/i;

let downloads = load(DL_KEY, []) || [];
if (!Array.isArray(downloads)) downloads = [];
const dlBlobs = new Map();                       // id -> Blob (живёт до перезапуска)
let dlSeq = Date.now();

const dlSave   = () => save(DL_KEY, downloads.slice(0, 60));
const dlById   = id => downloads.find(x => x.id === id);
const dlActive = () => downloads.filter(x => x.state === 'loading').length;

function fmtSize(b) {
  b = +b || 0;
  if (b < 1024) return b + ' Б';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' КБ';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' МБ';
  return (b / 1073741824).toFixed(2) + ' ГБ';
}

/** Имя файла: переданное заранее или из адреса */
function dlName(url, name) {
  if (name) return String(name);
  try {
    const p = new URL(url).pathname.split('/').filter(Boolean).pop() || '';
    const d = decodeURIComponent(p).replace(/[#?].*$/, '');
    if (d && d.length < 120) return d;
  } catch {}
  return (host(url) || 'файл').replace(/^www\./, '');
}

/** Расширение для значка в списке */
function dlExt(name) {
  const m = String(name).match(/\.([a-z0-9]{1,5})$/i);
  return m ? m[1].toUpperCase() : 'ФАЙЛ';
}

/** Читаем ответ со счётчиком байтов */
async function dlRead(res, onProgress) {
  const len = +(res.headers.get('content-length') || 0);
  if (!res.body) return { blob: await res.blob(), size: len };
  const rd = res.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await rd.read();
    if (done) break;
    parts.push(value); got += value.length;
    if (onProgress) onProgress(got, len);
  }
  const type = res.headers.get('content-type') || 'application/octet-stream';
  return { blob: new Blob(parts, { type: type.split(';')[0] }), size: got };
}

/** Три пути к байтам: напрямую, свой прокси, публичный прокси */
async function dlFetch(url, onProgress) {
  try {                                          // 1. напрямую — у многих хостингов открыт CORS
    const ac = new AbortController();
    const to = setTimeout(() => ac.abort(), 12000);
    let r;
    try { r = await fetch(url, { mode: 'cors', credentials: 'omit', signal: ac.signal }); }
    finally { clearTimeout(to); }
    if (r.ok) return await dlRead(r, onProgress);
  } catch {}
  try {                                          // 2. наш прокси, если он рядом
    if (await detectLocalProxy()) {
      const r = await fetch('/api/raw?url=' + encodeURIComponent(url));
      if (r.ok) return await dlRead(r, onProgress);
    }
  } catch {}
  for (const px of [                             // 3. публичные прокси, отдающие байты как есть
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest='
  ]) {
    try {
      const r = await timeoutFetch(px + encodeURIComponent(url), 25000);
      if (r.ok) return await dlRead(r, onProgress);
    } catch {}
  }
  throw new Error('сервер не отдаёт файл');
}

/** Кладём файл в «Загрузки» устройства */
function dlSaveFile(id) {
  const rec = dlById(id), blob = dlBlobs.get(id);
  if (!rec || !blob) return false;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = rec.name;
  a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast('Сохранено: ' + rec.name);
  return true;
}

/** Открыть скачанное: картинку — своим просмотром, остальное — средствами браузера */
function dlOpen(id) {
  const rec = dlById(id), blob = dlBlobs.get(id);
  if (!rec || !blob) return;
  const u = URL.createObjectURL(blob);
  if (/^image\//.test(blob.type)) navigate(activeTab(), imgViewUrl(u, rec.url, rec.name));
  else window.open(u, '_blank');
  setTimeout(() => URL.revokeObjectURL(u), 120000);
}

function dlRemove(id) {
  dlBlobs.delete(id);
  downloads = downloads.filter(x => x.id !== id);
  dlSave(); dlRender();
}
function dlClear() {
  downloads.forEach(x => dlBlobs.delete(x.id));
  downloads = []; dlSave(); dlRender(); toast('Список очищен');
}

/** Основной вход: начать загрузку */
async function startDownload(url, name, opts) {
  if (!/^https?:\/\//i.test(url)) return null;
  const busy = downloads.find(x => x.url === url && x.state === 'loading');
  if (busy) { navigate(activeTab(), 'colosseum://downloads'); return busy; }
  const id = 'd' + (++dlSeq);
  const rec = { id, url, name: dlName(url, name), size: 0, got: 0, state: 'loading', mime: '', ts: Date.now() };
  downloads.unshift(rec); dlSave(); dlRender();
  toast('Скачиваю: ' + rec.name);
  try {
    const { blob, size } = await dlFetch(url, (got, len) => { rec.got = got; rec.size = len || got; dlRender(); });
    rec.size = blob.size || size; rec.got = rec.size; rec.mime = blob.type; rec.state = 'done';
    dlBlobs.set(id, blob);
    if (!opts || opts.autoSave !== false) dlSaveFile(id);
  } catch (e) {
    rec.state = 'error';
    rec.err = String((e && e.message) || e).slice(0, 40) || 'нет доступа';
    toast('Не вышло скачать: откройте ссылку — телефон сохранит файл сам');
    try { window.open(rec.url, '_blank', 'noopener'); } catch {}
  }
  dlSave(); dlRender();
  return rec;
}

/** Страница «Загрузки» */
function renderDownloads(tab) {
  tab.title = 'Загрузки';
  const rows = downloads.map(d => {
    const pct = d.size ? Math.min(100, Math.round(d.got / d.size * 100)) : 0;
    const has = dlBlobs.has(d.id);
    const st = d.state === 'done' && !has
      ? fmtSize(d.size) + ' · скачано раньше, нужно скачать заново'
      : d.state === 'done'
      ? fmtSize(d.size) + (d.mime ? ' · ' + String(d.mime).split('/')[1] : '')
      : d.state === 'loading'
        ? fmtSize(d.got) + (d.size ? ' из ' + fmtSize(d.size) : '')
        : 'Не получилось' + (d.err ? ': ' + d.err : '');
    const bar = d.state === 'loading'
      ? `<div class="dl-bar"><i style="width:${d.size ? pct : 12}%"></i></div>`
      : d.state === 'done' ? '<div class="dl-bar done"><i style="width:100%"></i></div>' : '';
    return `
    <div class="row dl-row">
      <div class="ic">${esc(dlExt(d.name))}</div>
      <div class="m">
        <div class="t">${esc(d.name)}</div>
        <div class="u">${esc(host(d.url))} · ${esc(st)}</div>
        ${bar}
      </div>
      ${d.state === 'done' && has ? `<button data-open="${d.id}">Открыть</button><button data-save="${d.id}">Сохранить</button>` : ''}
      ${d.state === 'error' || (d.state === 'done' && !has) ? `<button data-retry="${d.id}">Ещё раз</button>` : ''}
      ${d.state === 'error' ? `<button data-goto="${esc(d.url)}">Открыть ссылку</button>` : ''}
      <button data-del="${d.id}" title="Убрать из списка">×</button>
    </div>`;
  }).join('');
  internalHTML(tab, `
    <div class="plist">
      <h2>Загрузки</h2>
      <div class="sub">${downloads.length
        ? downloads.length + ' файлов · сами файлы хранятся до перезапуска браузера'
        : 'Пока ничего не скачано'}</div>
      ${downloads.length ? '<div style="margin:10px 0 16px"><button class="btn" id="dlClear">Очистить список</button></div>' : ''}
      ${downloads.length ? rows : `<div class="empty">
        <h2>Здесь появятся файлы</h2>
        <p>Ссылки на файлы — <b>pdf, zip, mp3, mp4, apk, epub, doc</b> и другие — перехватываются сами:
        нажмите на такую ссылку на любом сайте, и файл сохранится в «Загрузки» телефона.</p>
        <p>Картинку можно сохранить кнопкой <b>Скачать</b> в её просмотре.</p>
      </div>`}
    </div>`);
  const root = panes.querySelector(`.pane[data-id="${tab.id}"]`) || panes;
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => dlOpen(b.dataset.open));
  root.querySelectorAll('[data-save]').forEach(b => b.onclick = () => {
    if (!dlSaveFile(b.dataset.save)) toast('Файл уже выгружен — скачайте заново');
  });
  root.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => {
    const r = dlById(b.dataset.retry); if (r) startDownload(r.url, r.name);
  });
  root.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => window.open(b.dataset.goto, '_blank', 'noopener'));
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => dlRemove(b.dataset.del));
  const c = root.querySelector('#dlClear'); if (c) c.onclick = () => dlClear();
}

/** Перерисовка открытой вкладки загрузок (не чаще восьми раз в секунду) */
let dlTick = 0;
function dlRender() {
  updateDlBtn();
  const now = Date.now();
  if (now - dlTick < 120) return;
  dlTick = now;
  const t = activeTab();
  if (!t || !/^colosseum:\/\/downloads/i.test(t.url || '')) return;
  const el = panes.querySelector(`.pane[data-id="${t.id}"]`);
  const pos = el ? el.scrollTop : 0;
  renderDownloads(t);
  const el2 = panes.querySelector(`.pane[data-id="${t.id}"]`);
  if (el2) el2.scrollTop = pos;
}

function updateDlBtn() {
  const b = $('#dlBtn'), n = $('#dlCount');
  if (!b || !n) return;
  const a = dlActive() || downloads.filter(x => x.state === 'done').length;
  n.textContent = a;
  n.hidden = !a;
  b.classList.toggle('on', dlActive() > 0);
}

let adblockRules = { sel: [], hosts: [], paths: [], ts: 0 };
try { adblockRules = Object.assign(adblockRules, load('colosseum.adblock.v1', {})); } catch {}
let adblockCount = 0;
let _selCache = null;                       // кэш склейки встроенных и загруженных правил

function adblockOn() { return settings.adblock !== false; }
function allSelectors() {
  if (!_selCache) _selCache = AD_SELECTORS.concat(adblockRules.sel || []);
  return _selCache;
}
function allHosts() { return AD_HOSTS.concat(adblockRules.hosts || []); }

/* Множество доменов для быстрой проверки: без перебора десятков тысяч строк на каждый URL */
let _hostSet = null;
function hostSet() {
  if (!_hostSet) _hostSet = new Set(allHosts());
  return _hostSet;
}
function dropCaches() { _selCache = null; _hostSet = null; }

/** Рекламный ли адрес. Учитывает домены целиком и точные пути (||host/path^). */
function isAdHost(url) {
  try {
    const h = new URL(url).hostname.toLowerCase();
    const set = hostSet();
    if (set.has(h)) return true;
    for (let i = h.indexOf('.'); i > 0; i = h.indexOf('.', i + 1)) {   // поддомены
      if (set.has(h.slice(i + 1))) return true;
    }
    if (AD_HOSTS.some(p => h.includes(p))) return true;                // встроенные: мягкое совпадение
    const full = url.toLowerCase();
    if ((adblockRules.paths || []).some(p => full.includes(p))) return true;
    return /\/ads?[?/.]|(^|\/)(adservice|adserver|adfox|banner|doubleclick|pixel)/.test(full);
  } catch { return false; }
}

/** CSS, который прячет рекламу (каждое правило отдельно — битый селектор не убьёт остальные) */
function adblockCSS() {
  return allSelectors().slice(0, 4000).map(s => s + '{display:none!important}').join('\n');
}

/** Вырезает рекламные узлы из документа до показа. Возвращает сколько убрано. */
function adblockClean(doc) {
  if (!adblockOn()) return 0;
  let n = 0;
  // 1) по селекторам — батчами: один querySelectorAll на 40 правил вместо 40 вызовов
  const sels = allSelectors();
  for (let i = 0; i < sels.length; i += 40) {
    const part = sels.slice(i, i + 40);
    try {
      doc.querySelectorAll(part.join(',')).forEach(el => { if (el.tagName !== 'BODY') { el.remove(); n++; } });
    } catch {
      part.forEach(sel => { try { doc.querySelectorAll(sel).forEach(el => { if (el.tagName !== 'BODY') { el.remove(); n++; } }); } catch {} });
    }
  }
  // 2) по адресам: картинки, фреймы, стили, скрипты, ссылки
  try {
    doc.querySelectorAll('img,iframe,frame,script,link,source,embed,object,a').forEach(el => {
      const u = el.getAttribute('src') || el.getAttribute('href') || el.getAttribute('data-src') || '';
      if (u && isAdHost(u)) { el.remove(); n++; }
    });
  } catch {}
  // 3) элементы, у которых в классе/id явно рекламные маркеры
  try {
    doc.querySelectorAll('div,section,aside,span,li').forEach(el => {
      const c = ((el.className || '') + ' ' + (el.id || '')).toLowerCase();
      if (/(^|[^a-z])(ad|ads|adv|advert|reklama|реклама)([-_ ]|$)/.test(c) && (el.textContent || '').trim().length < 900) {
        el.remove(); n++;
      }
    });
  } catch {}
  adblockCount += n;
  return n;
}

/** Загрузка внешних списков: EasyList, EasyPrivacy, AdGuard */
const AD_LISTS = [
  ['EasyList',       'https://easylist.to/easylist/easylist.txt'],
  ['EasyPrivacy',    'https://easylist.to/easylist/easyprivacy.txt'],
  ['AdGuard Базовый','https://filters.adtidy.org/extension/chromium/filters/2.txt'],
  ['AdGuard Русский','https://filters.adtidy.org/extension/chromium/filters/1.txt']
];

/**
 * Разбор списка фильтров.
 *  ||host^            → блокировать домен целиком
 *  ||host/path        → блокировать только этот путь (домен НЕ трогаем)
 *  [домены]##selector → скрыть элемент
 *  #@# и @@ (исключения) пропускаются.
 */
function parseFilterList(text, acc) {
  text.split('\n').forEach(line => {
    line = line.trim();
    if (!line || line[0] === '!' || line.startsWith('@@') || line.startsWith('[') || line.startsWith('#')) return;
    if (line.includes('#@#')) return;                                  // исключение
    let m = line.match(/^\|\|([a-z0-9.-]+)\^/i);                      // ||домен^
    if (m) { if (acc.hosts.size < 12000) acc.hosts.add(m[1].toLowerCase()); return; }
    m = line.match(/^\|\|([a-z0-9.-]+)(\/[a-z0-9._\/-]{3,60})\^?/i); // ||домен/путь
    if (m) { if (acc.paths.size < 6000) acc.paths.add((m[1] + m[2]).toLowerCase()); return; }
    const h = line.match(/^(?:[a-z0-9.\-]+(?:,[a-z0-9.\-]+)*)?##(?!@)(.+)$/i);
    if (h) {
      const sel = h[1].trim();
      if (sel.length < 3 || sel.length > 120) return;
      if (sel.includes('script:') || sel.includes('^') || sel.includes('extended')
          || sel.includes(':style') || sel.includes('[') || sel.includes('{')) return;
      if (acc.sel.size < 4000) acc.sel.add(sel);
    }
  });
}

async function updateAdFilters(silent) {
  const acc = { sel: new Set(), hosts: new Set(), paths: new Set(), ok: [], bad: [] };
  progress(true);
  for (const [name, url] of AD_LISTS) {
    try {
      const { html } = await fetchPage(url);
      const before = acc.sel.size + acc.hosts.size + acc.paths.size;
      parseFilterList(html, acc);
      acc.ok.push(name + ' (' + (acc.sel.size + acc.hosts.size + acc.paths.size - before) + ')');
    } catch (e) { acc.bad.push(name); }
  }
  progress(false);
  if (acc.sel.size || acc.hosts.size) {
    adblockRules = { sel: [...acc.sel], hosts: [...acc.hosts], paths: [...acc.paths], ts: Date.now() };
    dropCaches();
    save('colosseum.adblock.v1', adblockRules);
    if (!silent) toast('Фильтры обновлены: ' + acc.sel.size + ' селекторов, ' + acc.hosts.size + ' доменов');
  } else if (!silent) {
    toast('Не удалось скачать списки');
  }
  return adblockRules;
}

function toggleAdblock() {
  settings.adblock = !adblockOn();
  save(K.set, settings);
  updateAdBtn();
  toast(settings.adblock ? 'Блокировка рекламы включена' : 'Блокировка рекламы выключена');
  const t = activeTab();
  if (t && !isInternal(t.url) && t.view !== 'reader') loadWeb(t, t.url, true);
}
function updateAdBtn() {
  const b = $('#adBtn'); if (!b) return;
  b.classList.toggle('on', adblockOn());
  b.title = adblockOn()
    ? `Реклама блокируется (${adblockCount} за сессию${adblockRules.sel.length ? ', списки: ' + adblockRules.sel.length : ''})`
    : 'Блокировка рекламы выключена';
}

/* ======================================================================
   12. ОРАКУЛ — быстрый бот-сканер
   Берёт запрос, находит страницы своей выдачей, параллельно сканирует
   их и собирает ответ из лучших фрагментов с указанием источников.
   Всё локально: никаких внешних ИИ и ключей.
   ====================================================================== */
const oracleCache = new Map();

function decodeEnt(t) {
  return String(t).replace(/&(nbsp|#160);/gi, ' ')
    .replace(/&(laquo|#171);/g, '\u00ab').replace(/&(raquo|#187);/g, '\u00bb')
    .replace(/&(mdash|#8212);/g, '\u2014').replace(/&(ndash|#8211);/g, '\u2013')
    .replace(/&(quot|#34);/g, '"').replace(/&(amp|#38);/g, '&')
    .replace(/&(lt|#60);/g, '<').replace(/&(gt|#62);/g, '>')
    .replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d));
}
function splitPassages(text) {
  const sents = decodeEnt(text).split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 30);
  const out = []; let buf = '';
  sents.forEach(s => {
    buf += (buf ? ' ' : '') + s.trim();
    if (buf.length >= 300) { out.push(buf); buf = ''; }
  });
  if (buf.trim().length > 60) out.push(buf.trim());
  return out;
}

/** Резерв: собираем ответ из описаний (сниппетов) выдачи, если сайты не отдали текст. */
function answerFromSnippets(results, q) {
  const core = q.toLowerCase().split(/\s+/).filter(t => t.length > 2 && !Q_STOP.has(t));
  if (!core.length) return null;
  const scored = results
    .filter(r => r.snippet && r.snippet.length > 60 && !['images', 'openverse'].includes(r.source))
    .map(r => {
      const low = ((r.title || '') + ' ' + (r.snippet || '')).toLowerCase();
      let s = 0, hits = 0;
      core.forEach(t => {
        if (low.includes(t)) { hits++; s += 12; }
        else if (stemSet(low).has(stemRu(t))) { hits++; s += 7; }
      });
      s += hits * hits * 6 + Math.min(24, (r.score || 0) / 8);
      const nt = normTitle(r.title);                               // «Колизей (Москва)» — не то
      const par = String(r.title || '').toLowerCase().match(/\(([^)]{2,40})\)/);
      if (par && !q.toLowerCase().includes(par[1])) s -= 26;
      return { r, s, hits };
    })
    .filter(x => x.hits > 0)
    .sort((a, b) => b.s - a.s)
    .slice(0, 4);
  if (!scored.length) return null;
  return {
    text: scored.map(x => {
      const t = (x.r.snippet || '').replace(/\s+/g, ' ').trim();
      const cut = t.length > 320 ? t.slice(0, 320).replace(/\s+\S*$/, '') + '…' : t;
      return (x.r.title ? x.r.title + '. ' : '') + cut;
    }).join('\n'),
    sources: scored.map(x => ({ url: x.r.url, title: x.r.title, srcLabel: x.r.srcLabel, w: x.s }))
  };
}

/** Из вопроса делаем поисковый запрос по теме:
    «кто построил Колизей» → «Колизей», «почему небо синее» → «небо синее». */
const Q_VERB = /^(построил|построила|построили|написал|написала|написали|создал|создала|создали|основал|основала|основали|открыл|открыла|открыли|изобр[её]л|изобрела|изобрели|придумал|придумали|отменил|отменили|вв[её]л|ввели|завоевал|завоевали|нарисовал|нарисовали|снял|сняли|назвал|назвали|ставил|поставил|сочинил|сочинили|перев[её]л|перевели)$/;
function topicQuery(q) {
  const w = String(q).toLowerCase().replace(/[?!.,;:«»"'`]/g, ' ').split(/\s+/).filter(Boolean);
  const keep = w.filter(t => !Q_STOP.has(t) && !Q_VERB.test(t) && t.length > 1);
  const out = keep.length ? keep.join(' ') : w.join(' ');
  return out.length >= 2 ? out : String(q).trim();
}

async function oracleAnswer(q, onProgress) {
  q = (q || '').trim();
  if (!q) return null;
  if (oracleCache.has(q)) return oracleCache.get(q);

  const t0 = performance.now();
  onProgress && onProgress('Ищу страницы…');
  // Ищем тремя запросами разом: по теме («Колизей»), вопросом целиком
  // и по имени собственному. Что нашлось в нескольких — почти всегда то, что нужно.
  const first = await arenaSearch(q, { fast: true }).catch(() => ({ results: [] }));
  const lists = [first];
  if ((first.results || []).length < 5) {                        // по вопросу мало — добавим по теме
    const sq2 = topicQuery(q);
    if (sq2 && sq2 !== q.toLowerCase()) lists.push(await arenaSearch(sq2, { fast: true }).catch(() => ({ results: [] })));
  }
  const seen = new Map();
  lists.forEach(({ results }) => (results || []).forEach(r => {
    const e = seen.get(r.url);
    if (e) { e.k++; if ((r.score || 0) > (e.r.score || 0)) e.r = r; }
    else seen.set(r.url, { r, k: 1 });
  }));
  const results = [...seen.values()]
    .sort((a, b) => (b.k - a.k) || ((b.r.score || 0) - (a.r.score || 0)))
    .map(x => x.r);
  // Оракулу нужны страницы с обычным текстом: карточки архива и DOI-ссылки почти ничего не дают
  const plain = results.filter(r => !['images', 'openverse', 'archive', 'science'].includes(r.source));
  // и страницы именно про это: поиск часто приносит «Китай» на запрос про кита — по заголовку отсекаем
  const cw = q.toLowerCase().split(/[^a-zа-яё0-9]+/i).filter(t => t.length >= 4 && !Q_STOP.has(t));
  const aboutIt = r => {
    const t = String(r.title || '').toLowerCase();
    const ts = stemSet(t);
    return cw.some(w => t.includes(w) || ts.has(stemRu(w)) ||
      (w.length >= 5 && t.split(/[^a-zа-яё0-9]+/).some(x => x.length >= 5 &&
        (x.startsWith(w.slice(0, 5)) || w.startsWith(x.slice(0, 5))))));
  };
  const onTopic = cw.length ? plain.filter(aboutIt) : [];
  const cands = (onTopic.length ? onTopic : plain).slice(0, 8);

  onProgress && onProgress(`Сканирую ${cands.length} источников…`);
  // качаем все страницы сразу, но не ждём отстающих вечно:
  // берём то, что успело, а медленных — после короткой паузы
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const settled = [];                                   // {i, page} — порядок поиска сохраняем
  let done = 0, ready = 0;
  const wFirst = cands.map((r, i) => ({ r, i }))                 // сначала Википедия — она быстрая
    .sort((a, b) => (WIKI_RE.test(b.r.url) ? 1 : 0) - (WIKI_RE.test(a.r.url) ? 1 : 0) || a.i - b.i);
  const jobs = wFirst.map(async ({ r, i }) => {
    let v = null;
    try {
      let text = '', title = r.title;
      const w = await wikiText(r.url).catch(() => null);   // Википедия — напрямую, без прокси
      if (w) { text = w.text; title = w.title || title; }
      else {
        const { html } = await withTimeout(fetchPage(r.url), 9500);
        const art = extractArticle(html, r.url);
        title = art.title || title;
        text = decodeEnt(art.html
          .replace(/<script[\s\S]*?<\/script>/gi, ' ')
          .replace(/<(figcaption|figure|table|sup)[^>]*>[\s\S]*?<\/\1>/gi, ' ')
          .replace(/<[^>]+>/g, ' '))
          .replace(/(основная статья|см\.? также|подробнее см\.|см\. в статье)\s*:[^.]{0,90}/gi, ' ')
          .replace(/\s+/g, ' ').trim();
      }
      if (text.length >= 120) {
        v = { url: r.url, title, text, srcLabel: r.srcLabel, w: r.score || 0 };
        ready++;
      }
    } catch {}
    settled.push({ i, page: v });
    done++;
    return v;
  });
  // ждём: пока не наберём 4 годные страницы, пока все не закончат, или максимум 7 секунд
  const topTwo = () => settled.filter(x => x.i < 2 && x.page).length;   // две первые по рангу
  const enough = (async () => {
    while (done < cands.length && (ready < 3 || topTwo() < 2)) await sleep(100);
  })();
  await Promise.race([Promise.all(jobs), enough, sleep(6500)]);
  let good = settled.filter(x => x.page).sort((a, b) => a.i - b.i).map(x => x.page);
  if (!good.length) {                                   // ничего не успело — даём второй шанс
    onProgress && onProgress('Жду отстающие сайты…');
    await Promise.race([Promise.all(jobs), sleep(4500)]);
    good = settled.filter(x => x.page).sort((a, b) => a.i - b.i).map(x => x.page);
  }
  if (!good.length) {                                   // сайты молчат — отвечаем по описаниям
    const fb = answerFromSnippets(results, q);
    return {
      q, answer: fb ? fb.text : '', sources: fb ? fb.sources : [],
      ms: Math.round(performance.now() - t0), scanned: 0, mode: fb ? 'snippets' : 'none'
    };
  }

  onProgress && onProgress('Собираю ответ…');
  const terms = q.toLowerCase().split(/\s+/).filter(t => t.length > 2);
  const core = terms.filter(t => !Q_STOP.has(t));
  const topic = core[core.length - 1] || terms[terms.length - 1] || '';   // главное слово запроса
  const stems = ps => stemSet(ps);                                         // построил ↔ построен
  const words = ps => ps.toLowerCase().split(/[^a-zа-яё0-9]+/i).filter(w => w.length >= 4);
  const ql = q.toLowerCase();
  const askWhen = /(^|\s)(когда|в каком году|в каком веке|какого года)/.test(ql);
  const askWhy  = /(^|\s)(почему|зачем|отчего|причины|причина|по какой причине|с какой целью)/.test(ql);
  const askWho  = /(^|\s)(кто|кем|чья|чьё|какой человек)/.test(ql);
  const askMany = /(^|\s)(сколько|численность|количество)/.test(ql);
  const askWhat = /^\s*(что (такое|есть|такой|такая|такие)|кто (такой|такая|такие)|что значит|определение|что называ)/i.test(q);
  const askFame = /(чем знаменит|чем известен|известен тем|что изобрёл|чем прославился|кем был|кто такой)/i.test(q);

  const scored = [];
  good.forEach((p, rank) => {
    let srcBonus = [44, 28, 18, 11, 6, 3, 1, 0][rank] ?? 0;        // чем выше источник в выдаче
    let titleOK = 0;                                               // заголовок про то же? -1 / +1
    // «Жириновский (нейросеть)» — тема в скобках, а не в заголовке: такой источник слабее
    const nt = normTitle(p.title) || '';
    const rawT = String(p.title || '').toLowerCase();              // normTitle стирает скобки
    const par = rawT.match(/\(([^)]{2,40})\)/);
    if (par) {
      const head = rawT.replace(/\([^)]*\)/g, ' ');              // без скобок, но из живого заголовка
      const hit = txt => core.some(t => txt.includes(t) || stemSet(txt).has(stemRu(t)));
      if (hit(par[1]) && !hit(head)) srcBonus -= 40;               // тема только в скобках
      else if (!hit(par[1]) && !hit(head)) srcBonus -= 8;
      titleOK = hit(head) ? 1 : -1;
    } else if (nt) {
      const tStem = stemSet(nt);
      const tWords = rawT.split(/[^a-zа-яё0-9]+/).filter(w => w.length >= 5);
      const hits = core.filter(t => nt.includes(t) || tStem.has(stemRu(t)) ||
        (t.length >= 5 && tWords.some(w => w.startsWith(t.slice(0, 5)) || t.startsWith(w.slice(0, 5))))).length;
      srcBonus += hits ? Math.min(24, hits * 8) : -34;             // заголовок о том же / не о том
      titleOK = hits ? 1 : -1;
      // «что такое нейросеть» → статья «Нейронная сеть»: совпадение по корню в заголовке
      if (askWhat && topic && topic.length >= 5 && hit(topic.slice(0, 5))) srcBonus += 18;
      function hit(pref) {
        return nt.includes(pref) || String(p.title).toLowerCase().split(/[^a-zа-яё0-9]+/i)
          .some(w => w.length >= 5 && (w.startsWith(pref) || pref.startsWith(w.slice(0, 5))));
      }
    }
    splitPassages(p.text).forEach((ps, pi, arr) => {
      const low = ps.toLowerCase();
      const rel = pi / Math.max(1, arr.length - 1);              // введение статьи важнее
      const st = stems(ps);
      const wl = words(ps);
      let s = srcBonus + (titleOK > 0 ? 22 : -22), hits = 0;       // статья про то же — важнее слов
      core.forEach(t => {                                           // только смысловые слова
        if (low.includes(t)) { hits++; s += 6 + Math.min(10, t.length / 2); }
        else if (st.has(stemRu(t))) { hits++; s += 4 + Math.min(8, t.length / 2); }  // та же основа
        else if (t.length >= 5 && wl.some(w => w.length >= 5 &&
                 (w.startsWith(t.slice(0, 5)) || t.startsWith(w.slice(0, 5))))) { hits++; s += 3; }
      });
      if (topic) {                                                  // есть главное слово запроса
        if (low.includes(topic)) s += 12;
        else if (st.has(stemRu(topic))) s += 10;                    // та же основа
        else if (topic.length >= 5 && wl.some(w => w.length >= 5 &&
                 (w.startsWith(topic.slice(0, 5)) || topic.startsWith(w.slice(0, 5))))) s += 8;
      }
      if (topic && new RegExp('^' + topic.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(ps.trim())) s += 10;
      if (askWho) {                                                // «кто …» — нужен человек
        if (/(император|архитектор|по проекту|под руководством|автор|создател|основател|построил|построен|возвед|воздвигнут|начал строительств|заложил|руководил)/i.test(ps)) s += 12;
        if (/[А-ЯЁ][а-яё]{2,}\s+[А-ЯЁ][а-яё]{2,}/.test(ps)) s += 6;   // Имя Фамилия
      }
      if (askMany) {                                               // «сколько …» — нужно число с единицей
        const unit = /(метр|километр|сантиметр|миллиметр|грамм|килограмм|тонн|литр|штук|человек|процент|градус|экземпляр|км\b|кг\b|млн|тыс|год|лет|сут|час|минут)/i.test(ps);
        if (/\b\d[\d\s.,]{0,7}\s*(метр|километр|сантиметр|миллиметр|грамм|килограмм|тонн|литр|штук|человек|процент|градус|экземпляр|км\b|кг\b|млн|тыс)/i.test(ps)) s += 16;
        else if (/\d/.test(ps) && !unit) s -= 12;                  // просто цифры — перечень, а не ответ
        if (/(весит|вес|высота|длин|ширин|рост|масса|численность|количество|стоимост|населени|объём|площадь|составляет|достигает|равн)/i.test(ps)) s += 12;
      }
      if (askWhen) {                                               // «когда …» — нужна дата
        if (/\b(1[0-9]{3}|20[0-9]{2})\b/.test(ps)) s += 14;
        if (/(начал|начат|произошл|состоял|основан|построен|открыт|введ|подписан|случил|стартовал|заверш|закончил|вступил)/i.test(ps)) s += 10;
      }
      if (askWhy) {                                                // «почему …» — нужно следствие
        if (/(потому|поскольку|так как|из-за|по причине|для того|чтобы|благодаря|цель|причин|следстви)/i.test(ps)) s += 14;
      }
      if (askFame) {                                               // «чем знаменит …»
        if (/(известен|знаменит|прославил|создал|написал|изобрёл|открыл|автор|мастер|гений|творчеств|шедевр)/i.test(ps)) s += 14;
      }
      s += hits * hits * 6;                                         // покрытие разных терминов
      s += Math.min(14, (p.w || 0) / 10);                           // вес источника
      if (hits === 0) s -= 25;                                      // фрагмент ни о чём
      if (ps.length < 110) s -= 18;
      if (ps.split(/\s+/).length < 12) s -= 30;                      // обрывок фразы
      if (/[«\u201c(]\s*$/.test(ps.trim())) s -= 30;                 // обрывается на цитате
      if (!/[.!?]$/.test(ps.trim())) s -= 12;                       // обрывок
      const caps = (ps.match(/\b[А-ЯA-ZЁ][а-яёa-z]{3,}/g) || []).length;
      if (caps >= 4 && ps.split(/\s+/).length < 26) s -= 24;        // цепочка заголовков и ссылок
      const digits = (ps.match(/\d/g) || []).length;
      const tiny = (ps.match(/\b[а-яёa-z]{1,3}\b/g) || []).length;
      if (digits > 14 || tiny > 12) s -= 22;                        // таблица или список значений
      if (/^[\d(]/.test(ps.trim())) s -= 12;
      // инфобоксы и наградные списки: «( ( ) 1875 ) Японский Высший орден Хризантемы»
      const parens = (ps.match(/[()]/g) || []).length;
      if (parens >= 4) s -= 30;
      if (/(орден|кавалер|награжд|медал|лауреат|преми[яи]|награда|наград)\b/i.test(ps)) s -= 26;
      if ((ps.match(/[«\u201c]/g) || []).length >= 3) s -= 15;       // перечень названий в кавычках
      const letters = (ps.match(/[а-яёa-z]/gi) || []).length;
      if (ps.length > 60 && letters / ps.length < 0.62) s -= 26;    // слишком много цифр и знаков
      const wc = ps.split(/\s+/).length;
      if (caps >= 3 && caps / wc > 0.18) s -= 20;                   // подписи, поля инфобокса
      if (/\.\.\.|…/.test(ps)) s -= 14;                             // обрывки и художественные цитаты
      if (wc < 40 && /\([^)]*\d{3,4}[^)]*\)/.test(ps)) s -= 20;      // подписи к картинам, перечни
      if (/^[\u00ab"\u201c\u2014—]/.test(ps.trim())) s -= 12;
      if (/\b(покосился|сказал|подумал|воскликнул|спросил|ответил)\b/i.test(ps)) s -= 18;
      if (rel < 0.25) s += 8;                                       // введение статьи
      const sents = ps.split(/(?<=[.!?])\s+/);
      const hasT = sn => core.some(t => sn.toLowerCase().includes(t) || stemSet(sn).has(stemRu(t)));
      if (askWhen && sents.some(sn => /\b(1[0-9]{3}|20[0-9]{2})\b/.test(sn) && hasT(sn))) s += 18;
      else if (askWhen && /\b(1[0-9]{3}|20[0-9]{2})\b/.test(ps)) s += 6;
      if (askWhy && sents.some(sn => hasT(sn) &&
          /(потому что|поскольку|так как|из-за|в результате|причин|следстви|целью|чтобы|обусловл|вызван|привело|привёл|привела|вынудил|вынужд|необходимост|требовал|стимул|толчок|поэтому|вследстви|благодаря)/.test(sn))) s += 20;
      if (askWho && /(был|была|было|автор|основател|создал|написал|построил|архитектор|возглавил)/.test(low)) s += 8;
      if (askMany && /\d/.test(ps)) s += 10;
      if (/(cookie|подпис|реклам|авториз|войти в аккаунт|включите javascript|материал из википедии|существуют и другие значения)/i.test(ps)) s -= 30;
      scored.push({ p, text: ps, s });
    });
  });
  scored.sort((a, b) => b.s - a.s);

  const picked = [], perSrc = {};
  const topScore = scored.length ? scored[0].s : 0;
  const topSrc = scored.length ? scored[0].p.url : '';
  const used = new Set();
  for (const it of scored) {
    if (it.s < topScore - 20) break;                                // слишком слабый фрагмент
    if (it.p.url !== topSrc && !used.has(it.p.url) && used.size >= 2) continue;  // максимум 2 источника
    perSrc[it.p.url] = (perSrc[it.p.url] || 0) + 1;
    if (perSrc[it.p.url] > 2) continue;
    if (picked.some(x => x.text === it.text)) continue;
    used.add(it.p.url);
    picked.push(it);
    if (picked.length >= 3) break;                                  // лучше меньше, но точнее
  }

  // если спросили «почему», а причина в ответ не попала — берём лучший фрагмент с причиной
  if (askWhy && picked.length) {
    const CAUSE = /(потому что|поскольку|так как|из-за|в результате|причин|следстви|целью|чтобы|обусловл|вызван|привело|привёл|привела|вынудил|вынужд|необходимост|требовал|стимул|толчок|поэтому|вследстви|благодаря)/i;
    if (!picked.some(x => CAUSE.test(x.text))) {
      const cause = scored.find(x => CAUSE.test(x.text) && (x.p.url === topSrc || used.has(x.p.url)));
      if (cause) {
        if (picked.length >= 3) picked.pop();
        picked.push(cause);
      }
    }
  }
  picked.sort((a, b) => b.s - a.s);

  // склеиваем и обрезаем по границе предложения, а не на полуслове
  let answer = picked.map(x => x.text.trim().replace(/\s+/g, ' ')).join('\n').trim();
  if (answer.length > 1200) {
    const cut = answer.slice(0, 1200);
    const m = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
    answer = m > 500 ? cut.slice(0, m + 1) : cut.replace(/\s+\S*$/, '') + '…';
  }
  const urls = [...new Set(picked.map(x => x.p.url))];
  const sources = urls.map(u => good.find(g => g.url === u)).filter(Boolean);
  const res = {
    q, answer, sources,
    ms: Math.round(performance.now() - t0),
    scanned: good.length, mode: good.length ? 'pages' : 'snippets',
    ts: Date.now()
  };
  if (res.answer) oracleCache.set(q, res);             // пустые результаты не кэшируем
  return res;
}

function renderOracle(tab, data, loading) {
  const body = loading
    ? `<div class="skel" style="width:80%"></div><div class="skel" style="width:92%;height:16px"></div>
       <div class="skel" style="width:70%"></div><div class="skel" style="width:45%"></div>`
    : (data && data.answer
      ? `<div class="oracle-answer">${esc(data.answer)}</div>
         ${data.mode === 'snippets' ? `<div class="oracle-note">Сайты не отдали текст — ответ собран по описаниям из выдачи Arena.</div>` : ''}
         <div class="oracle-src">
           <div class="oh">${data.mode === 'snippets' ? 'Описания из выдачи' : 'Источники'} (${data.sources.length}) · просканировано ${data.scanned} · ${data.ms} мс</div>
           ${data.sources.map(s => `
             <div class="osrc" data-url="${esc(s.url)}">
               <span class="badge">${esc(s.srcLabel)}</span>
               <b>${esc(s.title)}</b>
               <span class="u">${esc(host(s.url))}</span>
             </div>`).join('')}
         </div>`
      : `<div class="empty"><h2>Ответ не собрался</h2>
           <p>Сайты не отдали текст — возможно, они медленные или блокируют загрузку.</p>
           <div style="margin-top:14px"><button class="btn" data-retry>Попробовать снова</button></div>
         </div>`);

  internalHTML(tab, `
  <div class="oracle">
    <div class="oh-head">
      <div class="brand" data-go="colosseum://home">${ORACLE_IMG}<span>Оракул</span></div>
      <div class="qbox"><span class="ic">&#9906;</span><input id="orQ" value="${esc(data ? data.q : '')}" spellcheck="false"></div>
    </div>
    <div class="oracle-box">${body}</div>
  </div>`);

  const root = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  const inp = root.querySelector('#orQ');
  inp?.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()) navigate(tab, 'colosseum://oracle?q=' + encodeURIComponent(inp.value.trim())); });
  root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => navigate(tab, b.dataset.go));
  root.querySelectorAll('[data-url]').forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); navigate(tab, b.dataset.url); });
}

async function runOracle(tab, q) {
  tab.title = 'Оракул: ' + q;
  tab.search = null;
  renderOracle(tab, { q }, true);
  progress(true);
  let data;
  try { data = await oracleAnswer(q, msg => { const el = panes.querySelector('.oracle-box'); if (el) el.innerHTML = `<div class="oracle-wait">${esc(msg)}</div>`; }); }
  catch (e) { data = { q, answer: '', sources: [], ms: 0, scanned: 0, mode: 'none' }; }
  progress(false);
  if (tab.url !== 'colosseum://oracle?q=' + encodeURIComponent(q)) return;
  renderOracle(tab, data, false);
}

/* ======================================================================
   13. ПЕРЕВОД СТРАНИЦ И ВЫДЕЛЕННОГО ТЕКСТА
   Провайдеры: свой LibreTranslate (настраивается) → MyMemory (без ключа).
   ====================================================================== */
const trCache = new Map();
try { (load('colosseum.tr.v1', []) || []).forEach(([k, v]) => trCache.set(k, v)); } catch {}
function trRemember(k, v) {                       // кэш переводов переживает перезапуск
  trCache.set(k, v);
  try { save('colosseum.tr.v1', [...trCache].slice(-200)); } catch {}
}

function detectLang(text) {
  const cyr = (text.match(/[а-яё]/gi) || []).length;
  const lat = (text.match(/[a-z]/gi) || []).length;
  return cyr > lat ? 'ru' : 'en';
}
function splitChunks(text, size) {
  const sents = text.split(/(?<=[.!?])\s+/);
  const out = []; let buf = '';
  sents.forEach(s => {
    if ((buf + ' ' + s).length > size && buf) { out.push(buf); buf = s; }
    else buf = buf ? buf + ' ' + s : s;
  });
  if (buf.trim()) out.push(buf);
  return out;
}

async function translateText(text, target, onProgress) {
  target = target || settings.translateTo || 'ru';
  const source = detectLang(text);
  if (source === target) return { text, cached: false, provider: 'не требуется' };

  const key = target + '|' + text.slice(0, 120) + '|' + text.length;
  if (trCache.has(key)) return trCache.get(key);
  // MyMemory без ключа даёт дневной лимит: длинные страницы режем сильнее
  const limit = settings.translateUrl ? 9000 : 4200;

  const chunks = splitChunks(text.slice(0, limit), 450);
  const out = [];
  let done = 0, provider = '';
  const queue = [...chunks];
  const workers = Array.from({ length: 3 }, async () => {
    while (queue.length) {
      const chunk = queue.shift();
      if (chunk === undefined) break;
      let res = '';
      for (let attempt = 0; attempt < 2 && !res; attempt++) {
        try {
          res = await translateChunk(chunk, source, target);
          if (!provider) provider = translateChunk.lastProvider;
        } catch (e) {
          if (attempt === 1) res = chunk;            // не смогли — оставляем как есть
          await new Promise(r => setTimeout(r, 600));
        }
      }
      out.push({ i: chunks.indexOf(chunk), t: res });
      done++;
      onProgress && onProgress(Math.round(done / chunks.length * 100));
    }
  });
  await Promise.all(workers);
  const parts = out.sort((a, b) => a.i - b.i).map(x => x.t);
  const failed = parts.filter((t, i) => t === chunks[i]).length;
  if (!provider) throw new Error('лимит переводчика');
  const result = {
    text: parts.join(' '),
    provider: provider || '—',
    source, target, truncated: text.length > limit,
    failed: failed
  };
  trRemember(key, result);
  return result;
}

/** Запрос к переводчику: напрямую (CORS), иначе через свой прокси server.py */
async function trFetch(u) {
  try {
    const r = await timeoutFetch(u, 18000);
    if (r.ok) return JSON.parse(await r.text());
  } catch {}
  try {                                             // свой прокси снимает ограничения CORS
    const r2 = await timeoutFetch('/api/fetch?url=' + encodeURIComponent(u), 18000);
    const j = await r2.json();
    if (j && j.ok && j.text) return JSON.parse(j.text);
  } catch {}
  throw new Error('переводчик недоступен');
}

async function translateChunk(text, source, target) {
  // 1) свой сервер перевода (LibreTranslate и совместимые)
  if (settings.translateUrl) {
    try {
      const r = await timeoutFetch('/api/fetch', 25000, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: settings.translateUrl.replace(/\/+$/, '') + '/translate',
                               json: { q: text, source, target, format: 'text' } })
      });
      const j = await r.json();
      if (j.ok && j.text) {
        const d = JSON.parse(j.text);
        const t = d.translatedText || d.translation || (d.data && d.data.translatedText);
        if (t) { translateChunk.lastProvider = 'свой сервер'; return t; }
      }
    } catch {}
  }
  // 2) MyMemory (работает без ключа)
  const u = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.slice(0, 480))
          + '&langpair=' + encodeURIComponent(source + '|' + target);
  const j = await trFetch(u);
  const t = j && j.responseData && j.responseData.translatedText;
  if (!t) throw new Error('нет ответа');
  if (/MYMEMORY WARNING|QUERY LENGTH LIMIT|TOO MANY REQUESTS|USAGE LIMIT/i.test(t)) throw new Error(t.slice(0, 60));
  translateChunk.lastProvider = 'MyMemory';
  return t.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
}

async function translatePage(tab) {
  if (isInternal(tab.url)) { toast('Перевод — для сайтов'); return; }
  progress(true);
  try {
    if (!settings.translateUrl) toast('Переводим через MyMemory — есть дневной лимит');
    if (!tab.raw) { const r = await fetchPage(tab.url); tab.raw = r.html; }
    const art = extractArticle(tab.raw, tab.url);
    const text = art.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const tr = await translateText(text, settings.translateTo || 'ru', p => {
      progress(true); $('#toast').textContent = 'Перевод… ' + p + '%'; $('#toast').classList.add('show');
    });
    $('#toast').classList.remove('show');
    tab.view = 'translate';
    renderTranslation(tab, art, tr);
  } catch (e) {
    progress(false);
    sheet(`<h3>Перевод не удался</h3>
      <p style="font-size:14px;line-height:1.6">${esc(String(e.message || e))}</p>
      <p style="font-size:13px;color:var(--ink-3)">Бесплатный MyMemory имеет дневной лимит запросов.
      Поднимите свой LibreTranslate (<code>docker run -p 5000:5000 libretranslate/libretranslate</code>)
      и укажите его в настройках — тогда лимита не будет.</p>`);
  }
  progress(false);
}

function renderTranslation(tab, art, tr) {
  internalHTML(tab, `
  <div class="reader">
    <h1 class="rtitle">${esc(tr.text ? art.title : art.title + ' — перевод недоступен')}</h1>
    <div class="rmeta">
      Перевод: ${esc(tr.source)} → ${esc(tr.target)} · ${esc(tr.provider)} · машинный перевод
      ${tr.truncated ? '<span class="badge">первые ' + esc(String(Math.round(tr.text.length))) + ' знаков</span>' : ''}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-t="orig">Оригинал</button>
        <button class="btn" data-t="read">Режим чтения</button>
        <button class="btn" data-t="again">Перевести заново</button>
      </div>
    </div>
    <div class="rbody">${esc(tr.text || '').split(/(?<=\.)\s+/).map(p => p.trim() ? `<p>${esc(p)}</p>` : '').join('')}</div>
    <div class="rnotice">Источник: ${esc(tab.url)}</div>
  </div>`);
  const root = panes.querySelector(`.pane[data-id="${tab.id}"]`);
  root.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const a = b.dataset.t;
    if (a === 'orig') { tab.view = null; updateReaderBtn(); loadWeb(tab, tab.url, true); }
    if (a === 'read') { tab.view = null; openReader(tab); }
    if (a === 'again') { trCache.clear(); translatePage(tab); }
  });
  root.scrollTop = 0;
}

async function translateSelection() {
  const sel = (getSelection() || '').toString().trim()
           || (frames.get(activeTab().id) ? '' : '');
  if (!sel) { toast('Сначала выделите текст на странице'); return; }
  sheet(`<h3>Перевод</h3><div class="kv"><span>Язык</span><span>${esc(detectLang(sel))} → ${esc(settings.translateTo || 'ru')}</span></div>
    <div id="trOut" class="reader"><div class="skel" style="width:90%"></div><div class="skel" style="width:70%"></div></div>`,
    async box => {
      try {
        const tr = await translateText(sel.slice(0, 3000), settings.translateTo || 'ru');
        box.querySelector('#trOut').innerHTML =
          `<div class="rbody" style="font-size:16px">${esc(tr.text)}</div>
           <div class="rnotice">${esc(tr.provider)} · ${esc(tr.source)} → ${esc(tr.target)}</div>`;
      } catch (e) {
        box.querySelector('#trOut').innerHTML = `<p style="color:var(--terra)">Не удалось перевести: ${esc(String(e.message || e))}</p>`;
      }
    });
}
